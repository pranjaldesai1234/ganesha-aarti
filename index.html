<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Shri Ganesh Aarti Sangrah</title>
<style>
  :root {
    --beige: #faf6ea; --beige-deep: #f1e8d2; --red: #6b0f1a; --red-deep: #4a0a12; --gold: #b8872f; --text: #6b0f1a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --beige: #241a14; --beige-deep: #1c130f; --red: #e8a89c; --red-deep: #f5c7bd; --gold: #d9ae5f; --text: #f2ddd3;
    }
  }
  :root[data-theme="dark"] {
    --beige: #241a14; --beige-deep: #1c130f; --red: #e8a89c; --red-deep: #f5c7bd; --gold: #d9ae5f; --text: #f2ddd3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--beige);
    font-family: 'Georgia', 'Noto Serif Devanagari', 'Noto Sans Gujarati', serif;
    color: var(--text); min-height: 100vh; -webkit-text-size-adjust: 100%;
  }

  /* Welcome */
  #welcome {
    min-height: 100vh; width: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; text-align: center;
    padding: 0 0 40px 0; position: relative; overflow-x: hidden;
  }
  #welcome .bgwrap { position: relative; width: 100%; max-width: 520px; }
  #welcome .bgimg {
    width: 100%; display: block; max-height: 42vh; object-fit: cover;
    border-bottom-left-radius: 40% 18px; border-bottom-right-radius: 40% 18px;
    box-shadow: 0 8px 24px rgba(122,20,20,0.15);
  }
  #welcome .ganeshimg {
    position: absolute; bottom: -70px; left: 50%; transform: translateX(-50%);
    width: 55%; max-width: 240px; filter: drop-shadow(0 10px 18px rgba(0,0,0,0.25));
  }
  #welcome .welcome-text { margin-top: 90px; padding: 0 24px; max-width: 480px; }
  #welcome h1 { color: var(--red); font-size: 1.75rem; margin: 0.2em 0 0.1em 0; letter-spacing: 0.3px; }
  #welcome .om { font-size: 1.8rem; color: var(--gold); margin-bottom: 4px; }
  #welcome p.sub { color: var(--red-deep); font-size: 1.02rem; margin: 8px 0 22px 0; line-height: 1.5; opacity: 0.92; }
  #welcome .lang-label { color: var(--red-deep); font-size: 0.92rem; margin-bottom: 12px; opacity: 0.85; }
  .lang-buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
  .lang-btn {
    background: var(--red); color: var(--beige); border: none; border-radius: 14px;
    padding: 15px 20px; font-size: 1.1rem; font-family: inherit; cursor: pointer;
    box-shadow: 0 4px 10px rgba(122,20,20,0.25); transition: transform 0.15s ease, background 0.15s ease;
  }
  .lang-btn:hover { background: var(--red-deep); transform: translateY(-2px); }
  .lang-btn:active { transform: translateY(0px) scale(0.98); }
  .lang-btn .native { font-weight: bold; }
  .lang-btn .sub2 { display:block; font-size: 0.7rem; opacity: 0.8; margin-top: 2px; }

  /* Index */
  #index-screen { display: none; min-height: 100vh; background: var(--beige); }
  .index-topbar {
    position: sticky; top: 0; background: var(--beige-deep); border-bottom: 2px solid var(--red);
    padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;
  }
  .index-topbar h1 { color: var(--red); font-size: 1.3rem; margin: 0; }
  .icon-btn {
    background: none; border: 1.5px solid var(--red); color: var(--red); border-radius: 8px;
    padding: 7px 12px; font-size: 0.85rem; cursor: pointer; font-family: inherit;
  }
  .icon-btn:hover { background: var(--red); color: var(--beige); }
  .index-list { max-width: 640px; margin: 0 auto; padding: 20px 18px 60px 18px; display: flex; flex-direction: column; gap: 14px; }
  .index-item {
    display: block; width: 100%; text-align: left; background: var(--beige-deep);
    border: 2px solid var(--gold); border-radius: 16px; padding: 18px 20px;
    font-family: inherit; font-size: 1.15rem; color: var(--red); cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06); transition: transform 0.12s ease, background 0.12s ease;
  }
  .index-item:hover { background: var(--gold); color: var(--beige-deep); transform: translateX(4px); }
  .index-num { font-weight: bold; opacity: 0.7; margin-right: 8px; }

  /* Section reading view */
  #section-screen { display: none; min-height: 100vh; background: var(--beige); }
  .section-topbar {
    position: sticky; top: 0; background: var(--beige-deep); border-bottom: 2px solid var(--red);
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .section-content { max-width: 640px; margin: 0 auto; padding: 24px 22px 90px 22px; }
  .section-content h2 { color: var(--red); font-size: 1.5rem; margin: 0 0 20px 0; line-height: 1.4; text-align: center; }
  .section-body {
    color: var(--red); font-size: 1.2rem; line-height: 2.1; white-space: pre-wrap; word-break: break-word;
  }
  .nav-footer {
    display: flex; justify-content: space-between; max-width: 640px; margin: 0 auto; padding: 10px 22px 40px 22px; gap: 10px;
  }
  .nav-footer button {
    flex: 1; background: none; border: 1.5px solid var(--red); color: var(--red); border-radius: 10px;
    padding: 12px; font-size: 1rem; cursor: pointer; font-family: inherit;
  }
  .nav-footer button:hover { background: var(--red); color: var(--beige); }
  .nav-footer button:disabled { opacity: 0.35; cursor: not-allowed; }

  @media (min-width: 600px) { .section-body { font-size: 1.25rem; } }
</style>
</head>

const AARTI_DATA = {"gu": {"docTitle": "શ્રી ગણેશ આરતી સંગ્રહ", "sections": [{"title": "૧. મંગલાચરણ શ્લોક", "body": "વક્રતુણ્ડ મહાકાય સૂર્યકોટિ સમપ્રભ ।\nનિર્વિઘ્નં કુરુ મે દેવ સર્વકાર્યેષુ સર્વદા ॥"}, {"title": "૨. શ્રી ગણેશ સ્તોત્રમ્ (સંકટનાશન સ્તોત્ર)", "body": "(પાઠ કરને સે સર્વ સંકટ ટલ જાતે હૈં)\n(નારદ ઉવાચ)\nપ્રણમ્ય શિરસા દેવં ગૌરીપુત્રં વિનાયકમ્ ।\nભક્તાવાસં સ્મરેન્નિત્યમાયુઃકામાર્થસિદ્ધયે ॥\nપ્રથમં વક્રતુણ્ડં ચ એકદન્તં દ્વિતીયકમ્ ।\nતૃતીયં કૃષ્ણપિઙ્ગાક્ષં ગજવક્ત્રં ચતુર્થકમ્ ॥\nલમ્બોદરં પઞ્ચમં ચ ષષ્ઠં વિકટમેવ ચ ।\nસપ્તમં વિઘ્નરાજં ચ ધૂમ્રવર્ણં તથાષ્ટકમ્ ॥\nનવમં ભાલચન્દ્રં ચ દશમં તુ વિનાયકમ્ ।\nએકાદશં ગણપતિં દ્વાદશં તુ ગજાનનમ્ ॥\nદ્વાદશૈતાનિ નામાનિ ત્રિસન્ધ્યં યઃ પઠેન્નરઃ ।\nન ચ વિઘ્નભયં તસ્ય સર્વસિદ્ધિકરં પરમ્ ॥\nવિદ્યાર્થી લભતે વિદ્યાં ધનાર્થી લભતે ધનમ્ ।\nપુત્રાર્થી લભતે પુત્રાન્મોક્ષાર્થી લભતે ગતિમ્ ॥\nજપેદ્ગણપતિસ્તોત્રં ષડ્ભિર્માસૈઃ ફલં લભેત્ ।\nસંવત્સરેણ સિદ્ધિં ચ લભતે નાત્ર સંશયઃ ॥\nઅષ્ટભ્યો બ્રાહ્મણેભ્યશ્ચ લિખિત્વા યઃ સમર્પયેત્ ।\nતસ્ય વિદ્યા ભવેત્સર્વા ગણેશસ્ય પ્રસાદતઃ ॥\nઇતિ શ્રી નારદપુરાણે સંકટનાશનં ગણપતિસ્તોત્રં સમ્પૂર્ણમ્ ॥"}, {"title": "૩. જય ગણેશ દેવા (આરતી)", "body": "જય ગણેશ જય ગણેશ, જય ગણેશ દેવા ।\nમાતા જાકી પાર્વતી, પિતા મહાદેવા ॥ (x2)\n\nએક દંત દયાવંત, ચાર ભુજાધારી । (x2)\n\nમાથે પર તિલક સોહે, મૂસે કી સવારી ॥ (x2)\n\nજય ગણેશ જય ગણેશ, જય ગણેશ દેવા ॥\nમાતા જાકી પાર્વતી, પિતા મહાદેવા ॥\n\nપાન ચઢ઼ે, ફૂલ ચઢ઼ે, ઔર ચઢ઼ે મેવા । (x2)\n\nલડ્ડુઅન કા ભોગ લગે, સંત કરેં સેવા ॥ (x2)\n\nજય ગણેશ જય ગણેશ, જય ગણેશ દેવા ॥\nમાતા જાકી પાર્વતી, પિતા મહાદેવા ॥\n\nઅંધોં કો આઁખ દેત, કોઢ઼િન કો કાયા । (x2)\n\nબાઁઝન કો પુત્ર દેત, નિર્ધન કો માયા ॥ (x2)\n\nજય ગણેશ જય ગણેશ, જય ગણેશ દેવા ॥\nમાતા જાકી પાર્વતી, પિતા મહાદેવા ॥\n\nસૂરશ્યામ શરણ આએ, સફલ કીજે સેવા । (x2)\nમાતા જાકી પાર્વતી, પિતા મહાદેવા ॥\n\nજય ગણેશ જય ગણેશ, જય ગણેશ દેવા ॥\nમાતા જાકી પાર્વતી, પિતા મહાદેવા ॥"}, {"title": "૪. સુખકર્તા દુઃખહર્તા (આરતી)", "body": "સુખકર્તા દુઃખહર્તા વાર્તા વિઘ્નાચી ।\nનુરવી પુરવી પ્રેમ કૃપા જયાચી ॥\nસર્વાંગી સુંદર ઉટી શેંદુરાચી ।\nકંઠી ઝળકે માળ મુક્તાફળાંચી ॥\nજય દેવ જય દેવ ।\nજય મંગલમૂર્તિ ।\nઓ શ્રી મંગલમૂર્તિ ।\nદર્શનમાત્રે મન કામના પૂર્તિ ॥\nજય દેવ જય દેવ ॥\nરત્નખચિત ફરા તુજ ગૌરીકુમરા ।\nચંદનાચી ઉટી કુંકુમકેશરા ॥\nહિરેજડિત મુકુટ શોભતો બરા ।\nરુણઝુણતી નૂપુરે ચરણી ઘાગરિયા ॥\nજય દેવ જય દેવ ।\nજય મંગલમૂર્તિ ।\nઓ શ્રી મંગલમૂર્તિ ।\nદર્શનમાત્રે મન કામના પૂર્તિ ॥\nજય દેવ જય દેવ ॥\nલંબોદર પીતાંબર ફણિવરબંધના ।\nસરળ સોંડ વક્રતુંડ ત્રિનયના ॥\nદાસ રામાચા વાટ પાહે સદના ।\nસંકટી પાવાવે નિર્વાણી રક્ષાવે સુરવરવંદના ॥\nજય દેવ જય દેવ ।\nજય મંગલમૂર્તિ ।\nઓ શ્રી મંગલમૂર્તિ ।\nદર્શનમાત્રે મન કામના પૂર્તિ ॥\nજય દેવ જય દેવ ॥"}, {"title": "૫. શેંદૂર લાલ ચઢ઼ાયો (આરતી)", "body": "શેંદૂર લાલ ચઢાયો, અચ્છા ગજમુખકો ।\nદોંદિલ લાલ બિરાજે, સુત ગૌરી હરકો ॥\nહાથ લિએ ગુડ઼લડ્ડૂ, સાઈં સુરવરકો ।\nમહિમા કહે ન જાય, લાગત હૂઁ પદકો ॥\nજય જય શ્રી ગણરાજ વિદ્યા સુખદાતા, સ્વામી સુખદાતા ।\nધન્ય તુમ્હારો દર્શન મેરા મન રમતા, જય દેવ ॥\nઅષ્ટૌ સિદ્ધિ દાસી, સંકટકો વૈરી ।\nવિઘ્ન વિનાશન મંગલ મૂરત અધિકારી ॥\nકોટી સૂરજ પ્રકાશ ઐસી છબિ તેરી ।\nગંડસ્થલ મદમસ્તક, ઝૂલે શશિ બિહારી ॥\nજય જય શ્રી ગણરાજ વિદ્યા સુખદાતા, સ્વામી સુખદાતા ।\nધન્ય તુમ્હારો દર્શન મેરા મન રમતા, જય દેવ ॥\nભાવ ભગતસે કોઈ શરણાગત આવે ।\nસંતત સંપત સબ હી, ભરપુર પાવે ॥\nઐસે તુમ મહારાજ મોકો અતિભાવે ।\nગોસાવી નંદન નિશદિન ગુણગાવે ॥\nજય જય શ્રી ગણરાજ વિદ્યા સુખદાતા, સ્વામી સુખદાતા ।\nધન્ય તુમ્હારો દર્શન મેરા મન રમતા, જય દેવ ॥"}, {"title": "૬. નાના પરિમલ દૂર્વા (આરતી)", "body": "નાના પરિમળ દૂર્વા શેંદૂર શમીપત્રે ।\nલાડૂ મોદક અન્ને પરિપૂરિત પાત્રે ॥\nઐસે પૂજન કેલ્યા, બીજાક્ષરમંત્રે ।\nઅષ્ટહી સિદ્ધિ નવનિધી દેસી ક્ષણમાત્રે ॥\n\nજય દેવ જય દેવ ।\nજય મંગલમૂર્તિ, શ્રી મંગલમૂર્તિ ।\nતુઝે ગુણ વર્ણાયા મજ કૈંચી સ્ફૂર્તિ ।\nજય દેવ જય દેવ ॥\n\nતુઝેં ધ્યાન નિરંતર જે કોણી કરિતી ।\nત્યાંચી સકળહિ પાપે વિઘ્નેહિ હરતી ॥\nવાજી વારણ શિબિકા સેવક સુત યુવતી ।\nસર્વહિ પાવુનિ અંતી ભવસાગર તરતી ॥\n\nજય દેવ જય દેવ ।\nજય મંગલમૂર્તિ, શ્રી મંગલમૂર્તિ ।\nતુઝે ગુણ વર્ણાયા મજ કૈંચી સ્ફૂર્તિ ।\nજય દેવ જય દેવ ॥\n\nશરણાગત સર્વસ્વે ભજતી તવચરણી ।\nકીર્તિ તયાંચી રાહે જોંવર શશિતરણી ॥\nત્રૈલોક્યી તે વિજયી અદ્ભુત યે કરણી ।\nગોસાવીનંદન રત નામસ્મરણી ॥\n\nજય દેવ જય દેવ ।\nજય મંગલમૂર્તિ, શ્રી મંગલમૂર્તિ ।\nતુઝે ગુણ વર્ણાયા મજ કૈંચી સ્ફૂર્તિ ।\nજય દેવ જય દેવ ॥"}, {"title": "૭. યેઈ હો વિઠ્ઠલે માઝે માઊલી (વિઠ્ઠલ આરતી)", "body": "યેઈ હો વિઠ્ઠલે માઝે માઊલી યે । (x2)\n\nનિઢળાવરી કર\nનિઢળાવરી કર ઠેવુની વાટ મી પાહે ॥\nહો ઠેવુની વાટ મી પાહે\n\nયેઈ હો વિઠ્ઠલે માઝે માઊલી યે । (x2)\n\nઆલિયા ગેલિયા હાતી ધાડી નિરોપ । (x2)\n\nપંઢરપુરી આહે\nપંઢરપુરી આહે માઝા માયબાપ ॥\nહો માઝા માયબાપ\n\nયેઈ હો વિઠ્ઠલે માઝે માઊલી યે\nયેઈ હો વિઠ્ઠલે માઝે માઊલી યે ॥ ૧ ॥\n\nપિવળા પીતાંબર કૈસા ગગની ઝળકલા । (x2)\n\nગરુડાવરી બૈસોનિ\nગરુડાવરી બૈસોનિ માઝા કૈવારી આલા ॥\nહો માઝા કૈવારી આલા\n\nયેઈ હો વિઠ્ઠલે માઝે માઊલી યે (x2)\n\nવિઠોબાચે રાજ્ય આમ્હાં નિત્ય દીપવાળી । (x2)\n\nવિષ્ણુદાસ નામા\nવિષ્ણુદાસ નામા જીવેંભાવેં ઓવાળી ॥\nહો જીવેંભાવેં ઓવાળી\n\nયેઈ હો વિઠ્ઠલે માઝે માઊલી યે (x2)\n\nઅસો નસો ભાવ આમ્હા તુઝિયા ઠાયી ।\nકૃપાદૃષ્ટી પાહે માઝ્યા પંઢરી રાયા ॥\n\nયેઈ હો વિઠ્ઠલે માઝે માઊલી યે\nયેઈ હો વિઠ્ઠલે માઝે માઊલી યે ॥ ૪ ॥"}, {"title": "૮. આરતી શંકરાચી (શિવ આરતી)", "body": "લવથવતી વિક્રાળા બ્રહ્માંડી માળા ।\nવિષેં કંઠ કાળા ત્રિનેત્રીં જ્વાળા ॥\nલાવણ્યસુંદર મસ્તકીં બાળા ।\nતેથુનિયાં જળ નિર્મળ વાહે ઝુળઝુળાં ॥ ૧ ॥\n\nજય દેવ જય દેવ ।\nજય શ્રી શંકરા ।\nહો સ્વામી શંકરા ।\nઆરતી ઓવાળૂં આરતી ઓવાળૂં ।\nતુજ કર્પૂરગૌરા ।\nજય દેવ જય દેવ\n\nકર્પુરગૌર ભોળા નયનીં વિશાળા ।\nઅર્ધાંગી પાર્વતી સુમનાંચ્યા માળા ॥\nવિભૂતીચે ઉધળણ શિતિકંઠ નીળા ।\nઐસા શંકર શોભે ઉમાવેલ્હાળા ॥ ૨ ॥\n\nજય દેવ જય દેવ ।\nજય શ્રી શંકરા ।\nહો સ્વામી શંકરા ।\nઆરતી ઓવાળૂં આરતી ઓવાળૂં ।\nતુજ કર્પૂરગૌરા ।\nજય દેવ જય દેવ\n\nદેવીં દૈત્યીં સાગર મંથન પૈં કેલેં ।\nત્યામાજી અવચિત હલહલ જે ઉઠિલેં ॥\nતેં ત્વાં અસુરપણેં પ્રાશન કેલેં ।\nનીળકંઠ નામ પ્રસિદ્ધ ઝાલેં ॥ ૩ ॥\n\nજય દેવ જય દેવ ।\nજય શ્રી શંકરા ।\nહો સ્વામી શંકરા ।\nઆરતી ઓવાળૂં આરતી ઓવાળૂં ।\nતુજ કર્પૂરગૌરા ।\nજય દેવ જય દેવ\n\nવ્યાઘ્રાંબર ફણિવરધર સુંદર મદનારી ।\nપંચાનન મનમોહન મુનિજનસુખકારી ॥\nશતકોટીંચે બીજ વાચે ઉચ્ચારી ।\nરઘુકુળટિળક રામદાસાઅંતરી ॥ ૪ ॥\n\nજય દેવ જય દેવ ।\nજય શ્રી શંકરા ।\nહો સ્વામી શંકરા ।\nઆરતી ઓવાળૂં આરતી ઓવાળૂં ।\nતુજ કર્પૂરગૌરા ।\nજય દેવ જય દેવ"}, {"title": "૯. આરતી શ્રી જ્ઞાનદેવાચી", "body": "આરતી જ્ઞાનરાજા ।\nમહાકૈવલ્યતેજા । કૈવલ્યતેજા\nસેવિતી સાધુસંત,\nમનુ વેધલા માઝા । વેધલા માઝા\nઆરતી જ્ઞાનરાજા ।\n\nલોપલે જ્ઞાન જગી ।\nહિત નેણતી કોણી । નેણતી કોણી\nઅવતાર પાંડુરંગ ।\nનામ ઠેવિલે જ્ઞાની । ઠેવિલે જ્ઞાની\nઆરતી જ્ઞાનરાજા ।\n\nકનકાચે તાટ કરી ।\nઉભ્યા ગોપિકા નારી । ગોપિકા નારી\nનારદ તુંબર હો ।\nસામ ગાયન કરી । ગાયન કરી\nઆરતી જ્ઞાનરાજા ।\n\nપ્રગટ ગુહ્ય બોલે ।\nવિશ્વ બ્રહ્મચિ કેલે । બ્રહ્મચિ કેલે\nરામ જનાર્દની પાયી મસ્તક ઠેવિલે ॥ મસ્તક ઠેવિલે\n\nઆરતી જ્ઞાનરાજા । (x3)"}, {"title": "૧૦. મંત્ર પુષ્પાંજલિ એવં શાંતિ મંત્ર", "body": "[યહાઁ સભી કો પુષ્પ અર્પણ કરેં — સબકો ફૂલ બાઁટેં]\nહરિ ૐ યજ્ઞેન યજ્ઞમયજન્ત દેવાઃ તાનિ ધર્માણિ પ્રથમાન્યાસન્ ।\nતે હ નાકં મહિમાનઃ સચન્ત યત્ર પૂર્વે સાધ્યાઃ સન્તિ દેવાઃ ॥\nૐ રાજાધિરાજાય પ્રસહ્યસાહિને । નમો વયં વૈશ્રવણાય કુર્મહે ।\nસ મે કામાન્કામકામાય મહ્યં । કામેશ્વરો વૈશ્રવણો દદાતુ ।\nકુબેરાય વૈશ્રવણાય મહારાજાય નમઃ ॥\nૐ સ્વસ્તિ સામ્રાજ્યં ભૌજ્યં સ્વારાજ્યં વૈરાજ્યં પારમેષ્ઠ્યં રાજ્યં મહારાજ્યમાધિપત્યમયં સમન્તપર્યાયી સ્યાત્સાર્વભૌમઃ સાર્વાયુષ આન્તાદાપરાર્ધાત્ । પૃથિવ્યૈ સમુદ્રપર્યંતાયા એકરાળિતિ ॥\nતદપ્યેષ શ્લોકોઽભિગીતો મરુતઃ પરિવેષ્ટારો મરુતસ્યાવસન્ ગૃહે । આવિક્ષિતસ્ય કામપ્રેર્વિશ્વેદેવાઃ સભાસદ ઇતિ ॥\nએકદંતાય વિદ્મહે વક્રતુંડાય ધીમહિ । તન્નો દંતી પ્રચોદયાત્ ॥\nૐ શાંતિ: શાંતિ: શાંતિ: ॥"}, {"title": "૧૧. જયજયકાર — ગિનતી ચૌપાઈ", "body": "એક દો તીન ચાર, ગણપતીકી જય જયકાર । (x2)\n\nગણપતીકી જય જયકાર । એક દો તીન ચાર (x2)\n\nપાંચ છહ સાત આઠ, ગણપતી હમારે સાથ । (x2)\n\nગણપતી હમારે સાથ । પાંચ છહ સાત આઠ (x2)\n\nનૌ દસ ગ્યારહ બારહ, ગણપતી હૈ સબસે પ્યારા । (x2)\n\nગણપતી હૈ સબસે પ્યારા । નૌ દસ ગ્યારહ બારહ (x2)\n\nતેરહ ચૌદહ પંદ્રહ સોલહ, ગણપતી હૈ સબસે ભોલા । (x2)\n\nગણપતી હૈ સબસે ભોલા । તેરહ ચૌદહ પંદ્રહ સોલહ (x2)\n\nસત્રહ અઠારહ ઉન્નીસ બીસ, ગણપતી હમારે બીચ ॥ (x2)\n\nગણપતી હમારે બીચ, સત્રહ અઠારહ ઉન્નીસ બીસ (x2)\n\nબોલો ગણપતી બાપ્પા / મોરયા\nમંગલમૂર્તી / મોરયા\n\nમોરયા રે બાપ્પા મોરયા રે ।\nમોરયા રે બાપ્પા મોરયા રે ॥ (x5)\n\nઉત્તર સે બોલો, ગણપતી બાપ્પા\nદક્ષિણ સે બોલો, ગણપતી બાપ્પા\nપૂરવ સે બોલો, ગણપતી બાપ્પા\nપશ્ચિમ સે બોલો, ગણપતી બાપ્પા\nઊપર સે બોલો, ગણપતી બાપ્પા\nનીચે સે બોલો, ગણપતી બાપ્પા\nધીરે સે બોલો, ગણપતી બાપ્પા\nપ્રેમ સે બોલો, ગણપતી બાપ્પા\nજોર સે બોલો, ગણપતી બાપ્પા\n\nઆધા લાડૂ ચોર્યા\nઅમે તમારા પોર્યા\nમોરયા રે બાપ્પા મોરયા રે"}, {"title": "૧૨. અષ્ટવિનાયક મોરયા મંત્ર", "body": "મોરયા મોરયા ગણપતી બાપ્પા મોરયા । (x2)\n\nમોરયા મોરયા અષ્ટવિનાયક મોરયા ॥ (x2)\n\nમોરયા મોરયા બલ્લાળેશ્વર મોરયા । (x2)\n\nમોરયા મોરયા અષ્ટવિનાયક મોરયા ॥ (x2)\n\nમોરયા મોરયા વરદવિનાયક મોરયા । (x2)\n\nમોરયા મોરયા અષ્ટવિનાયક મોરયા ॥ (x2)\n\nમોરયા મોરયા મહાગણપતી મોરયા । (x2)\n\nમોરયા મોરયા અષ્ટવિનાયક મોરયા ॥ (x2)\n\nમોરયા મોરયા સિદ્ધિવિનાયક મોરયા । (x2)\n\nમોરયા મોરયા અષ્ટવિનાયક મોરયા ॥ (x2)\n\nમોરયા મોરયા મયૂરેશ્વર મોરયા । (x2)\n\nમોરયા મોરયા અષ્ટવિનાયક મોરયા ॥ (x2)\n\nમોરયા મોરયા ગિરિજાત્મજ મોરયા । (x2)\n\nમોરયા મોરયા અષ્ટવિનાયક મોરયા ॥ (x2)\n\nમોરયા મોરયા વિઘ્નેશ્વર મોરયા । (x2)\n\nમોરયા મોરયા અષ્ટવિનાયક મોરયા ॥ (x2)\n\nમોરયા મોરયા ચિંતામણી મોરયા । (x2)\n\nમોરયા મોરયા અષ્ટવિનાયક મોરયા ॥ (x2)\n\nમોરયા મોરયા ગણપતી બાપ્પા મોરયા ॥ (x2)\n\nમોરયા રે બાપ્પા મોરયા રે ।\nમોરયા રે બાપ્પા મોરયા રે ॥ (x5)"}, {"title": "૧૩. પારિવારિક સ્વાગત ગીત", "body": "દેવા ગલી ગલી મેં શોર મચક હૈ,\nગલી ગલી મેં શોર મચક હૈ ।\nગણપતિ બાપ્પા મોરયા\n\nઆલા આલા રે ગજાનંદ આલા ।\n(અંધેરી) મેં આનંદ ઝાલા ।\n(દેસાઈ પરિવાર) મેં આનંદ ઝાલા ।\n\nગણપતિ બાપ્પા મોરયા, મંગલમૂર્તી મોરયા ।\nકૌન બોલેગા મોરયા, હમ બોલેગા મોરયા । (x2)\n\nગણપતિ ગજાનંદ મહારાજ કી જય ।\n\nવેલકમ વેલકમ ગજાનના । (x2)\nઆઇ લવ વિઠ્ઠલ રામાયણા ।\nગિવ મી દર્શન ગજાનના ।\n\nઆયે હાલ બાપ્પા બાપ્પા હાલ,\nમારે ઘરે તારુ કામ છે । (x2)\nતમને જમાડવાની હાવ છે રે બાપ્પા । (x2)\nગજાનંદ તારુ નામ છે રે બાપ્પા ।\nનમો નવરત્ના છે રે બાપ્પા ।\nહાલ હાલ હાલ ।\nઆયે હાલ બાપ્પા બાપ્પા હાલ, મારે ઘરે તારુ કામ છે । (x2)"}, {"title": "૧૪. નમો ગણેશદેવ નમો હનુમંતા", "body": "નમો ગણેશદેવ નમો હનુમંતા, (x2)\nબને દેવો માં કોણ બલવંતા? (x2)\n\nગણપતિજી કે'છે માને મોદક પેસાડો,\nહનુમાનજી કે'છે માને તેલ ચઢાવો।\n\nનમો ગણેશદેવ નમો હનુમંતા (x2)\nબને દેવો માં કોણ બલવંતા? (x2)\n\nગણપતિજી કે'છે માને ફૂલરા ની માળા,\nહનુમાનજી કે'છે માને આકરા ની માળા।\n\nનમો ગણેશદેવ નમો હનુમંતા (x2)\nબને દેવો માં કોણ બલવંતા? (x2)\n\nગણપતિજી કે'છે માને ઘી-ના રોટા,\nહનુમાનજી કે'છે માને સિંદૂર ના લોટા।\n\nનમો ગણેશદેવ નમો હનુમંતા (x2)\nબને દેવો માં કોણ બલવંતા? (x2)\n\nગણપતિજી કે'છે માને ચૂરમા લાડૂ,\nહનુમાનજી કે'છે માને તેલ ચઢે લાડૂ।\n\nનમો ગણેશદેવ નમો હનુમંતા (x2)\nબને દેવો માં કોણ બલવંતા? (x2)\n\nગણપતિજી કે'છે માને માતા અને પિતા,\nહનુમાનજી કે'છે માને રામ અને સીતા।\n\nનમો ગણેશદેવ નમો હનુમંતા (x2)\nબને દેવો માં કોણ બલવંતા? (x2)\n\nગણપતિજી કે'છે માને રિદ્ધિ સિદ્ધિ નારી,\nહનુમાનજી કે'છે માને હું તો બાલ બ્રહ્મચારી।\n\nનમો ગણેશદેવ નમો હનુમંતા (x2)\nબને દેવો માં કોણ બલવંતા? (x2)\n\nબને દેવો માં કોણ બલવંતા?\nઅય બન્ને દેવો માં બેવ બલવંતા! (x2)"}, {"title": "૧૫. ગણપતીનો થાળ (ભોગ ગીત)", "body": "મારે મંદિરિયે આજે કીધા છે । ભોજનીયા મન ભાવતા,\nવેલા વેલા આવજો ગણપતી બાપ્પા, વાર ન લાગે આવતા (x2)\n\nસ્વાગતમાં પુષ્પોની માળા તૈયાર છે। (૨)\nકોમલ કળી ઓથી માં ગૂંથેલો હાર છે\nઆનંદ આનંદ થાશે હૈયામાં પ્રેમ થકી પહેરાવતા,\nવેલા વેલા આવજો ગણપતી બાપ્પા, વાર ન લાગે આવતા\n\nમારે મંદિરિયે આજે કીધા છે ભોજનીયા મન ભાવતા,\nવેલા વેલા આવજો ગણપતી બાપ્પા, વાર ન લાગે આવતા\n\nરૂપાના બાજઠ પર કંચનનો થાળ છે (x2)\nસ્નેહ ભરી સામગ્રી સઘળી તૈયાર છે। (x2)\nએક પછી એક હું પીરસવા માંડુ, આવે આનંદ જમાડતા\nવેલા વેલા આવજો ગણપતી બાપ્પા, વાર ન લાગે આવતા\n\nમારે મંદિરિયે આજે કીધા છે ભોજનીયા મન ભાવતા,\nવેલા વેલા આવજો ગણપતી બાપ્પા, વાર ન લાગે આવતા\n\nબુંદીના લાડુ ને માવાની ઘારી\nપિસ્તાની બરડીને સેવ સુવાણી,\nપ્રેમે આરોગજો લચપચતા લાડુ,\nથાક લાગ્યા છે મને વાળતા,\nવેલા વેલા આવજો ગણપતી બાપ્પા, વાર ન લાગે આવતા\n\nમારે મંદિરિયે આજે કીધા છે ભોજનીયા મન ભાવતા,\nવેલા વેલા આવજો ગણપતી બાપ્પા, વાર ન લાગે આવતા\n\nદૂધીનો હલવો ને પુરણપોળી (x2)\nબેપડી રોટલી ને ધીમાં ડબોળી,\nમગજ, મેસુરને, મોહનથાળ ને વાર લાગી છે ઠારતા,\nવેલા વેલા આવજો ગણપતી બાપ્પા, વાર ન લાગે આવતા\n\nશાક કીધા છે મેં વિવિધ જાતના\nશાક કીધા છે મેં વિવિધ જાતના (૨)\nકરવા વખાણ શું કેસરિયા ભાતના, (x2)\n\nકઢી અને દાળ કરી વાત નિરાળી ના થાય કાને છે વધારતા,\nવેલા વેલા આવજો ગણપતી બાપ્પા, વાર ન લાગે આવતા\n\nજણ મારા ઘરનું તે જમનાનું જાણશો (x2)\n\nમુખવાસ કરીને બાપ્પા વાત મારી માનજો। (x2)\nરામ ભક્ત દેવ પ્રભુ નીતનીત આવજો।\nવાર ન લાગે આવતા\nવેલા વેલા આવજો ગણપતી બાપ્પા, વાર ન લાગે આવતા (x2)"}, {"title": "૧૬. પ્રાર્થના", "body": "ઘાલીન લોટાંગણ વંદીન ચરણ । ડોળ્યાંની પાહિન રૂપ તુઝેં ।\nપ્રેમેં આલિંગન આનંદેં પૂજન । ભાવેં ઓવાળીન મ્હણે નામા ॥\nત્વમેવ માતા ચ પિતા ત્વમેવ । ત્વમેવ બંધુશ્ચ સખા ત્વમેવ ।\nત્વમેવ વિદ્યા દ્રવિણં ત્વમેવ । ત્વમેવ સર્વં મમ દેવદેવ ॥\nકાયેન વાચા મનસેંદ્રિયૈર્વા । બુદ્ધ્યાત્મના વા પ્રકૃતિસ્વભાવાત્ ।\nકરોમિ યદ્યત્સકલં પરસ્મૈ । નારાયણાયેતિ સમર્પયામિ ॥\nઅચ્યુતં કેશવં રામનારાયણં । કૃષ્ણદામોદરં વાસુદેવં હરિમ્ ।\nશ્રીધરં માધવં ગોપિકાવલ્લભં । જાનકીનાયકં રામચંદ્રં ભજે ॥\nહરે રામ હરે રામ રામ રામ હરે હરે ।\nહરે કૃષ્ણ હરે કૃષ્ણ કૃષ્ણ કૃષ્ણ હરે હરે ॥\nકર્પૂરગૌરં કરુણાવતારં । સંસારસારં ભુજગેન્દ્રહારમ્ ।\nસદા વસન્તં હૃદયારવિન્દે । ભવં ભવાનીસહિતં નમામિ ॥\nમંગલ ભગવાન વિષ્ણુ, મંગલં ગરુડધ્વજઃ ।\nમંગલ પુણ્ડરીકાક્ષ, શ્રી મંગલાય તનો હરિઃ ॥\nસર્વમંગલ માંગલ્યે, શિવે સર્વાર્થ સાધિકે ।\nશરણ્યે ત્ર્યંબકે ગૌરી, નારાયણી નમોઽસ્તુતે ॥\nત્વમેવ માતા ચ પિતા ત્વમેવ । ત્વમેવ બંધુશ્ચ સખા ત્વમેવ ।\nત્વમેવ વિદ્યા દ્રવિણં ત્વમેવ । ત્વમેવ સર્વં મમ દેવદેવ ॥\nગુરુર્બ્રહ્મા ગુરુર્વિષ્ણુઃ ગુરુર્દેવો મહેશ્વરઃ ।\nગુરુઃ સાક્ષાત્ પરબ્રહ્મ તસ્મૈ શ્રીગુરવે નમઃ ॥"}, {"title": "૧૭. શ્રી ગણેશ વંદના એવં પ્રાર્થના", "body": "વિઘ્નેશ્વરાય વરદાય સુરપ્રિયાય । લમ્બોદરાય સકલાય જગદ્ધિતાય ॥ નાગાનનાય શ્રુતિયજ્ઞવિભૂષિતાય । ગૌરીસુતાય ગણનાથ નમો નમસ્તે ॥ વક્રતુંડ મહાકાય સૂર્યકોટિસમપ્રભ । નિર્વિઘ્નં કુરુ મે દેવ સર્વકાર્યેષુ સર્વદા ॥ આવાહનં ન જાનામિ ન જાનામિ તવાર્ચનમ્ । પૂજાં ચૈવ ન જાનામિ ક્ષમસ્વ પરમેશ્વર ॥ અન્યથા શરણં નાસ્તિ ત્વમેવ શરણં મમ । તસ્માત્કારુણ્યભાવેન રક્ષ રક્ષ મહેશ્વર ॥ ગતં પાપં ગતં દુઃખં ગતં દારિદ્ર્યમેવ ચ । આગતા સુખસંપત્તિઃ પુણ્યોઽહં તવ દર્શનાત્ ॥ મંત્રહીનં ક્રિયાહીનં ભક્તિહીનં સુરેશ્વર । યત્પૂજિતં મયા દેવ પરિપૂર્ણં તદસ્તુ મે ॥ યદક્ષરં પદભ્રષ્ટં માત્રાહીનં ચ યદ્ભવેત્ । તત્સર્વં ક્ષમ્યતાં દેવ પ્રસીદ પરમેશ્વર ॥"}, {"title": "૧૮. શ્રી ગણપતિ અથર્વશીર્ષમ્", "body": "ૐ નમસ્તે ગણપતયે । ત્વમેવ પ્રત્યક્ષં તત્ત્વમસિ । ત્વમેવ કેવલં કર્તાસિ । ત્વમેવ કેવલં ધર્તાસિ । ત્વમેવ કેવલં હર્તાસિ । ત્વમેવ સર્વં ખલ્વિદં બ્રહ્માસિ । ત્વં સાક્ષાદાત્માસિ નિત્યમ્ ॥ ઋતં વચ્મિ । સત્યં વચ્મિ ॥ અવ ત્વં મામ્ । અવ વક્તારમ્ । અવ શ્રોતારમ્ । અવ દાતારમ્ । અવ ધાતારમ્ । અવાનૂચાનમવ શિષ્યમ્ । અવ પશ્ચાત્તાત્ । અવ પુરસ્તાત્ । અવોત્તરાત્તાત્ । અવ દક્ષિણાત્તાત્ । અવ ચોર્ધ્વાત્તાત્ । અવાધરાત્તાત્ । સર્વતો માં પાહિ પાહિ સમન્તાત્ ॥ ત્વં વાઙ્મયસ્ત્વં ચિન્મયઃ । ત્વમાનન્દમયસ્ત્વં બ્રહ્મમયઃ । ત્વં સચ્ચિદાનન્દાદ્વિતીયોઽસિ । ત્વં પ્રત્યક્ષં બ્રહ્માસિ । ત્વં જ્ઞાનમયો વિજ્ઞાનમયોઽસિ ॥ સર્વં જગદિદં ત્વત્તો જાયતે । સર્વં જગદિદં ત્વત્તસ્તિષ્ઠતિ । સર્વં જગદિદં ત્વયિ લયમેષ્યતિ । સર્વં જગદિદં ત્વયિ પ્રત્યેતિ ॥ ત્વં ભૂમિરાપોઽનલોઽનિલો નભઃ । ત્વં ચત્વારિ વાક્પદાનિ । ત્વં ગુણત્રયાતીતઃ । ત્વમવસ્થાત્રયાતીતઃ । ત્વં દેહત્રયાતીતઃ । ત્વં કાલત્રયાતીતઃ । ત્વં મૂલાધારસ્થિતોઽસિ નિત્યમ્ । ત્વં શક્તિત્રયાત્મકઃ । ત્વાં યોગિનો ધ્યાયન્તિ નિત્યમ્ । ત્વં બ્રહ્મા ત્વં વિષ્ણુસ્ત્વં રુદ્રસ્ત્વમિન્દ્રસ્ત્વમગ્નિસ્ત્વં વાયુસ્ત્વં સૂર્યસ્ત્વં ચન્દ્રમાસ્ત્વં બ્રહ્મભૂર્ભુવઃસ્વરોમ્ ॥ ગણાદિં પૂર્વમુચ્ચાર્ય વર્ણાદિં તદનન્તરમ્ । અનુસ્વારઃ પરતરઃ । અર્ધેન્દુલસિતમ્ । તારેણ ઋદ્ધમ્ । એતત્તવ મનુસ્વરૂપમ્ । ગકારઃ પૂર્વરૂપમ્ । અકારો મધ્યમરૂપમ્ । અનુસ્વારશ્ચાન્ત્યરૂપમ્ । બિન્દુરુત્તરરૂપમ્ । નાદઃ સન્ધાનમ્ । સંહિતા સંધિઃ । સૈષા ગણેશવિદ્યા । ગણક ઋષિઃ । નિચૃદ્ગાયત્રીચ્છન્દઃ । ગણપતિર્દેવતા । ૐ ગં ગણપતયે નમઃ ॥ ગણેશ ગાયત્રી મન્ત્ર: એકદન્તાય વિદ્મહે વક્રતુણ્ડાય ધીમહિ । તન્નો દન્તી પ્રચોદયાત્ ॥ ધ્યાનમ્: એકદન્તં ચતુર્હસ્તં પાશમઙ્કુશધારિણમ્ । રદં ચ વરદં હસ્તૈર્બિભ્રાણં મૂષકધ્વજમ્ ॥ રક્તં લમ્બોદરં શૂર્પકર્ણકં રક્તવાસસમ્ । રક્તગન્ધાનુલિપ્તાઙ્ગં રક્તપુષ્પૈઃ સુપૂજિતમ્ ॥ ભક્તાનુકમ્પિનં દેવં જગત્કારણમચ્યુતમ્ । આવિર્ભૂતં ચ સૃષ્ટ્યાદૌ પ્રકૃતેઃ પુરુષાત્પરમ્ ॥ એવં ધ્યાયતિ યો નિત્યં સ યોગી યોગિનાં વરઃ ॥ નમસ્કારમન્ત્ર: નમો વ્રાતપતયે નમો ગણપતયે નમઃ પ્રમથપતયે । નમસ્તેઽસ્તુ લમ્બોદરાયૈકદન્તાય વિઘ્નવિનાશિને શિવસુતાય શ્રીવરદમૂર્તયે નમઃ ॥ એતદથર્વશીર્ષં યોઽધીતે । સ બ્રહ્મભૂયાય કલ્પતે । સ સર્વવિઘ્નૈર્ન બાધ્યતે । સ સર્વતઃ સુખમેધતે । સ પઞ્ચમહાપાપાત્પ્રમુચ્યતે । સાયમધીયાનો દિવસકૃતં પાપં નાશયતિ । પ્રાતરધીયાનો રાત્રિકૃતં પાપં નાશયતિ । સાયં પ્રાતઃ પ્રયુઞ્જાનોઽપાપો ભવતિ । સર્વત્રાધીયાનોઽપવિઘ્ન टि समप्रभ ।\nनिर्विघ्नं कुरु मे देव सर्वकार्येषु सर्वदा ॥"}, {"title": "२. श्री गणेश स्तोत्रम् (संकटनाशन स्तोत्र)", "body": "(पाठ करने से सर्व संकट टल जाते हैं)\n(नारद उवाच)\nप्रणम्य शिरसा देवं गौरीपुत्रं विनायकम् ।\nभक्तावासं स्मरेन्नित्यमायुःकामार्थसिद्धये ॥\nप्रथमं वक्रतुण्डं च एकदन्तं द्वितीयकम् ।\nतृतीयं कृष्णपिङ्गाक्षं गजवक्त्रं चतुर्थकम् ॥\nलम्बोदरं पञ्चमं च षष्ठं विकटमेव च ।\nसप्तमं विघ्नराजं च धूम्रवर्णं तथाष्टकम् ॥\nनवमं भालचन्द्रं च दशमं तु विनायकम् ।\nएकादशं गणपतिं द्वादशं तु गजाननम् ॥\nद्वादशैतानि नामानि त्रिसन्ध्यं यः पठेन्नरः ।\nन च विघ्नभयं तस्य सर्वसिद्धिकरं परम् ॥\nविद्यार्थी लभते विद्यां धनार्थी लभते धनम् ।\nपुत्रार्थी लभते पुत्रान्मोक्षार्थी लभते गतिम् ॥\nजपेद्गणपतिस्तोत्रं षड्भिर्मासैः फलं लभेत् ।\nसंवत्सरेण सिद्धिं च लभते नात्र संशयः ॥\nअष्टभ्यो ब्राह्मणेभ्यश्च लिखित्वा यः समर्पयेत् ।\nतस्य विद्या भवेत्सर्वा गणेशस्य प्रसादतः ॥\nइति श्री नारदपुराणे संकटनाशनं गणपतिस्तोत्रं सम्पूर्णम् ॥"}, {"title": "३. जय गणेश देवा (आरती)", "body": "जय गणेश जय गणेश, जय गणेश देवा ।\nमाता जाकी पार्वती, पिता महादेवा ॥ (x2)\n\nएक दंत दयावंत, चार भुजाधारी । (x2)\n\nमाथे पर तिलक सोहे, मूसे की सवारी ॥ (x2)\n\nजय गणेश जय गणेश, जय गणेश देवा ॥\nमाता जाकी पार्वती, पिता महादेवा ॥\n\nपान चढ़े, फूल चढ़े, और चढ़े मेवा । (x2)\n\nलड्डुअन का भोग लगे, संत करें सेवा ॥ (x2)\n\nजय गणेश जय गणेश, जय गणेश देवा ॥\nमाता जाकी पार्वती, पिता महादेवा ॥\n\nअंधों को आँख देत, कोढ़िन को काया । (x2)\n\nबाँझन को पुत्र देत, निर्धन को माया ॥ (x2)\n\nजय गणेश जय गणेश, जय गणेश देवा ॥\nमाता जाकी पार्वती, पिता महादेवा ॥\n\nसूरश्याम शरण आए, सफल कीजे सेवा । (x2)\nमाता जाकी पार्वती, पिता महादेवा ॥\n\nजय गणेश जय गणेश, जय गणेश देवा ॥\nमाता जाकी पार्वती, पिता महादेवा ॥"}, {"title": "४. सुखकर्ता दुःखहर्ता (आरती)", "body": "सुखकर्ता दुःखहर्ता वार्ता विघ्नाची ।\nनुरवी पुरवी प्रेम कृपा जयाची ॥\nसर्वांगी सुंदर उटी शेंदुराची ।\nकंठी झळके माळ मुक्ताफळांची ॥\nजय देव जय देव ।\nजय मंगलमूर्ति ।\nओ श्री मंगलमूर्ति ।\nदर्शनमात्रे मन कामना पूर्ति ॥\nजय देव जय देव ॥\nरत्नखचित फरा तुज गौरीकुमरा ।\nचंदनाची उटी कुंकुमकेशरा ॥\nहिरेजडित मुकुट शोभतो बरा ।\nरुणझुणती नूपुरे चरणी घागरिया ॥\nजय देव जय देव ।\nजय मंगलमूर्ति ।\nओ श्री मंगलमूर्ति ।\nदर्शनमात्रे मन कामना पूर्ति ॥\nजय देव जय देव ॥\nलंबोदर पीतांबर फणिवरबंधना ।\nसरळ सोंड वक्रतुंड त्रिनयना ॥\nदास रामाचा वाट पाहे सदना ।\nसंकटी पावावे निर्वाणी रक्षावे सुरवरवंदना ॥\nजय देव जय देव ।\nजय मंगलमूर्ति ।\nओ श्री मंगलमूर्ति ।\nदर्शनमात्रे मन कामना पूर्ति ॥\nजय देव जय देव ॥"}, {"title": "५. शेंदूर लाल चढ़ायो (आरती)", "body": "शेंदूर लाल चढायो, अच्छा गजमुखको ।\nदोंदिल लाल बिराजे, सुत गौरी हरको ॥\nहाथ लिए गुड़लड्डू, साईं सुरवरको ।\nमहिमा कहे न जाय, लागत हूँ पदको ॥\nजय जय श्री गणराज विद्या सुखदाता, स्वामी सुखदाता ।\nधन्य तुम्हारो दर्शन मेरा मन रमता, जय देव ॥\nअष्टौ सिद्धि दासी, संकटको वैरी ।\nविघ्न विनाशन मंगल मूरत अधिकारी ॥\nकोटी सूरज प्रकाश ऐसी छबि तेरी ।\nगंडस्थल मदमस्तक, झूले शशि बिहारी ॥\nजय जय श्री गणराज विद्या सुखदाता, स्वामी सुखदाता ।\nधन्य तुम्हारो दर्शन मेरा मन रमता, जय देव ॥\nभाव भगतसे कोई शरणागत आवे ।\nसंतत संपत सब ही, भरपुर पावे ॥\nऐसे तुम महाराज मोको अतिभावे ।\nगोसावी नंदन निशदिन गुणगावे ॥\nजय जय श्री गणराज विद्या सुखदाता, स्वामी सुखदाता ।\nधन्य तुम्हारो दर्शन मेरा मन रमता, जय देव ॥"}, {"title": "६. नाना परिमल दूर्वा (आरती)", "body": "नाना परिमळ दूर्वा शेंदूर शमीपत्रे ।\nलाडू मोदक अन्ने परिपूरित पात्रे ॥\nऐसे पूजन केल्या, बीजाक्षरमंत्रे ।\nअष्टही सिद्धि नवनिधी देसी क्षणमात्रे ॥\n\nजय देव जय देव ।\nजय मंगलमूर्ति, श्री मंगलमूर्ति ।\nतुझे गुण वर्णाया मज कैंची स्फूर्ति ।\nजय देव जय देव ॥\n\nतुझें ध्यान निरंतर जे कोणी करिती ।\nत्यांची सकळहि पापे विघ्नेहि हरती ॥\nवाजी वारण शिबिका सेवक सुत युवती ।\nसर्वहि पावुनि अंती भवसागर तरती ॥\n\nजय देव जय देव ।\nजय मंगलमूर्ति, श्री मंगलमूर्ति ।\nतुझे गुण वर्णाया मज कैंची स्फूर्ति ।\nजय देव जय देव ॥\n\nशरणागत सर्वस्वे भजती तवचरणी ।\nकीर्ति तयांची राहे जोंवर शशितरणी ॥\nत्रैलोक्यी ते विजयी अद्भुत ये करणी ।\nगोसावीनंदन रत नामस्मरणी ॥\n\nजय देव जय देव ।\nजय मंगलमूर्ति, श्री मंगलमूर्ति ।\nतुझे गुण वर्णाया मज कैंची स्फूर्ति ।\nजय देव जय देव ॥"}, {"title": "७. येई हो विठ्ठले माझे माऊली (विठ्ठल आरती)", "body": "येई हो विठ्ठले माझे माऊली ये । (x2)\n\nनिढळावरी कर\nनिढळावरी कर ठेवुनी वाट मी पाहे ॥\nहो ठेवुनी वाट मी पाहे\n\nयेई हो विठ्ठले माझे माऊली ये । (x2)\n\nआलिया गेलिया हाती धाडी निरोप । (x2)\n\nपंढरपुरी आहे\nपंढरपुरी आहे माझा मायबाप ॥\nहो माझा मायबाप\n\nयेई हो विठ्ठले माझे माऊली ये\nयेई हो विठ्ठले माझे माऊली ये ॥ १ ॥\n\nपिवळा पीतांबर कैसा गगनी झळकला । (x2)\n\nगरुडावरी बैसोनि\nगरुडावरी बैसोनि माझा कैवारी आला ॥\nहो माझा कैवारी आला\n\nयेई हो विठ्ठले माझे माऊली ये (x2)\n\nविठोबाचे राज्य आम्हां नित्य दीपवाळी । (x2)\n\nविष्णुदास नामा\nविष्णुदास नामा जीवेंभावें ओवाळी ॥\nहो जीवेंभावें ओवाळी\n\nयेई हो विठ्ठले माझे माऊली ये (x2)\n\nअसो नसो भाव आम्हा तुझिया ठायी ।\nकृपादृष्टी पाहे माझ्या पंढरी राया ॥\n\nयेई हो विठ्ठले माझे माऊली ये\nयेई हो विठ्ठले माझे माऊली ये ॥ ४ ॥"}, {"title": "८. आरती शंकराची (शिव आरती)", "body": "लवथवती विक्राळा ब्रह्मांडी माळा ।\nविषें कंठ काळा त्रिनेत्रीं ज्वाळा ॥\nलावण्यसुंदर मस्तकीं बाळा ।\nतेथुनियां जळ निर्मळ वाहे झुळझुळां ॥ १ ॥\n\nजय देव जय देव ।\nजय श्री शंकरा ।\nहो स्वामी शंकरा ।\nआरती ओवाळूं आरती ओवाळूं ।\nतुज कर्पूरगौरा ।\nजय देव जय देव\n\nकर्पुरगौर भोळा नयनीं विशाळा ।\nअर्धांगी पार्वती सुमनांच्या माळा ॥\nविभूतीचे उधळण शितिकंठ नीळा ।\nऐसा शंकर शोभे उमावेल्हाळा ॥ २ ॥\n\nजय देव जय देव ।\nजय श्री शंकरा ।\nहो स्वामी शंकरा ।\nआरती ओवाळूं आरती ओवाळूं ।\nतुज कर्पूरगौरा ।\nजय देव जय देव\n\nदेवीं दैत्यीं सागर मंथन पैं केलें ।\nत्यामाजी अवचित हलहल जे उठिलें ॥\nतें त्वां असुरपणें प्राशन केलें ।\nनीळकंठ नाम प्रसिद्ध झालें ॥ ३ ॥\n\nजय देव जय देव ।\nजय श्री शंकरा ।\nहो स्वामी शंकरा ।\nआरती ओवाळूं आरती ओवाळूं ।\nतुज कर्पूरगौरा ।\nजय देव जय देव\n\nव्याघ्रांबर फणिवरधर सुंदर मदनारी ।\nपंचानन मनमोहन मुनिजनसुखकारी ॥\nशतकोटींचे बीज वाचे उच्चारी ।\nरघुकुळटिळक रामदासाअंतरी ॥ ४ ॥\n\nजय देव जय देव ।\nजय श्री शंकरा ।\nहो स्वामी शंकरा ।\nआरती ओवाळूं आरती ओवाळूं ।\nतुज कर्पूरगौरा ।\nजय देव जय देव"}, {"title": "९. आरती श्री ज्ञानदेवाची", "body": "आरती ज्ञानराजा ।\nमहाकैवल्यतेजा । कैवल्यतेजा\nसेविती साधुसंत,\nमनु वेधला माझा । वेधला माझा\nआरती ज्ञानराजा ।\n\nलोपले ज्ञान जगी ।\nहित नेणती कोणी । नेणती कोणी\nअवतार पांडुरंग ।\nनाम ठेविले ज्ञानी । ठेविले ज्ञानी\nआरती ज्ञानराजा ।\n\nकनकाचे ताट करी ।\nउभ्या गोपिका नारी । गोपिका नारी\nनारद तुंबर हो ।\nसाम गायन करी । गायन करी\nआरती ज्ञानराजा ।\n\nप्रगट गुह्य बोले ।\nविश्व ब्रह्मचि केले । ब्रह्मचि केले\nराम जनार्दनी पायी मस्तक ठेविले ॥ मस्तक ठेविले\n\nआरती ज्ञानराजा । (x3)"}, {"title": "१०. मंत्र पुष्पांजलि एवं शांति मंत्र", "body": "[यहाँ सभी को पुष्प अर्पण करें — सबको फूल बाँटें]\nहरि ॐ यज्ञेन यज्ञमयजन्त देवाः तानि धर्माणि प्रथमान्यासन् ।\nते ह नाकं महिमानः सचन्त यत्र पूर्वे साध्याः सन्ति देवाः ॥\nॐ राजाधिराजाय प्रसह्यसाहिने । नमो वयं वैश्रवणाय कुर्महे ।\nस मे कामान्कामकामाय मह्यं । कामेश्वरो वैश्रवणो ददातु ।\nकुबेराय वैश्रवणाय महाराजाय नमः ॥\nॐ स्वस्ति साम्राज्यं भौज्यं स्वाराज्यं वैराज्यं पारमेष्ठ्यं राज्यं महाराज्यमाधिपत्यमयं समन्तपर्यायी स्यात्सार्वभौमः सार्वायुष आन्तादापरार्धात् । पृथिव्यै समुद्रपर्यंताया एकराळिति ॥\nतदप्येष श्लोकोऽभिगीतो मरुतः परिवेष्टारो मरुतस्यावसन् गृहे । आविक्षितस्य कामप्रेर्विश्वेदेवाः सभासद इति ॥\nएकदंताय विद्महे वक्रतुंडाय धीमहि । तन्नो दंती प्रचोदयात् ॥\nॐ शांति: शांति: शांति: ॥"}, {"title": "११. जयजयकार — गिनती चौपाई", "body": "एक दो तीन चार, गणपतीकी जय जयकार । (x2)\n\nगणपतीकी जय जयकार । एक दो तीन चार (x2)\n\nपांच छह सात आठ, गणपती हमारे साथ । (x2)\n\nगणपती हमारे साथ । पांच छह सात आठ (x2)\n\nनौ दस ग्यारह बारह, गणपती है सबसे प्यारा । (x2)\n\nगणपती है सबसे प्यारा । नौ दस ग्यारह बारह (x2)\n\nतेरह चौदह पंद्रह सोलह, गणपती है सबसे भोला । (x2)\n\nगणपती है सबसे भोला । तेरह चौदह पंद्रह सोलह (x2)\n\nसत्रह अठारह उन्नीस बीस, गणपती हमारे बीच ॥ (x2)\n\nगणपती हमारे बीच, सत्रह अठारह उन्नीस बीस (x2)\n\nबोलो गणपती बाप्पा / मोरया\nमंगलमूर्ती / मोरया\n\nमोरया रे बाप्पा मोरया रे ।\nमोरया रे बाप्पा मोरया रे ॥ (x5)\n\nउत्तर से बोलो, गणपती बाप्पा\nदक्षिण से बोलो, गणपती बाप्पा\nपूरव से बोलो, गणपती बाप्पा\nपश्चिम से बोलो, गणपती बाप्पा\nऊपर से बोलो, गणपती बाप्पा\nनीचे से बोलो, गणपती बाप्पा\nधीरे से बोलो, गणपती बाप्पा\nप्रेम से बोलो, गणपती बाप्पा\nजोर से बोलो, गणपती बाप्पा\n\nआधा लाडू चोर्या\nअमे तमारा पोर्या\nमोरया रे बाप्पा मोरया रे"}, {"title": "१२. अष्टविनायक मोरया मंत्र", "body": "मोरया मोरया गणपती बाप्पा मोरया । (x2)\n\nमोरया मोरया अष्टविनायक मोरया ॥ (x2)\n\nमोरया मोरया बल्लाळेश्वर मोरया । (x2)\n\nमोरया मोरया अष्टविनायक मोरया ॥ (x2)\n\nमोरया मोरया वरदविनायक मोरया । (x2)\n\nमोरया मोरया अष्टविनायक मोरया ॥ (x2)\n\nमोरया मोरया महागणपती मोरया । (x2)\n\nमोरया मोरया अष्टविनायक मोरया ॥ (x2)\n\nमोरया मोरया सिद्धिविनायक मोरया । (x2)\n\nमोरया मोरया अष्टविनायक मोरया ॥ (x2)\n\nमोरया मोरया मयूरेश्वर मोरया । (x2)\n\nमोरया मोरया अष्टविनायक मोरया ॥ (x2)\n\nमोरया मोरया गिरिजात्मज मोरया । (x2)\n\nमोरया मोरया अष्टविनायक मोरया ॥ (x2)\n\nमोरया मोरया विघ्नेश्वर मोरया । (x2)\n\nमोरया मोरया अष्टविनायक मोरया ॥ (x2)\n\nमोरया मोरया चिंतामणी मोरया । (x2)\n\nमोरया मोरया अष्टविनायक मोरया ॥ (x2)\n\nमोरया मोरया गणपती बाप्पा मोरया ॥ (x2)\n\nमोरया रे बाप्पा मोरया रे ।\nमोरया रे बाप्पा मोरया रे ॥ (x5)"}, {"title": "१३. पारिवारिक स्वागत गीत", "body": "देवा गली गली में शोर मचक है,\nगली गली में शोर मचक है ।\nगणपति बाप्पा मोरया\n\nआला आला रे गजानंद आला ।\n(अंधेरी) में आनंद झाला ।\n(देसाई परिवार) में आनंद झाला ।\n\nगणपति बाप्पा मोरया, मंगलमूर्ती मोरया ।\nकौन बोलेगा मोरया, हम बोलेगा मोरया । (x2)\n\nगणपति गजानंद महाराज की जय ।\n\nवेलकम वेलकम गजानना । (x2)\nआइ लव विठ्ठल रामायणा ।\nगिव मी दर्शन गजानना ।\n\nआये हाल बाप्पा बाप्पा हाल,\nमारे घरे तारु काम छे । (x2)\nतमने जमाडवानी हाव छे रे बाप्पा । (x2)\nगजानंद तारु नाम छे रे बाप्पा ।\nनमो नवरत्ना छे रे बाप्पा ।\nहाल हाल हाल ।\nआये हाल बाप्पा बाप्पा हाल, मारे घरे तारु काम छे । (x2)"}, {"title": "१४. नमो गणेशदेव नमो हनुमंता", "body": "नमो गणेशदेव नमो हनुमंता, (x2)\nबने देवो मां कोण बलवंता? (x2)\n\nगणपतिजी के'छे माने मोदक पेसाडो,\nहनुमानजी के'छे माने तेल चढावो।\n\nनमो गणेशदेव नमो हनुमंता (x2)\nबने देवो मां कोण बलवंता? (x2)\n\nगणपतिजी के'छे माने फूलरा नी माळा,\nहनुमानजी के'छे माने आकरा नी माळा।\n\nनमो गणेशदेव नमो हनुमंता (x2)\nबने देवो मां कोण बलवंता? (x2)\n\nगणपतिजी के'छे माने घी-ना रोटा,\nहनुमानजी के'छे माने सिंदूर ना लोटा।\n\nनमो गणेशदेव नमो हनुमंता (x2)\nबने देवो मां कोण बलवंता? (x2)\n\nगणपतिजी के'छे माने चूरमा लाडू,\nहनुमानजी के'छे माने तेल चढे लाडू।\n\nनमो गणेशदेव नमो हनुमंता (x2)\nबने देवो मां कोण बलवंता? (x2)\n\nगणपतिजी के'छे माने माता अने पिता,\nहनुमानजी के'छे माने राम अने सीता।\n\nनमो गणेशदेव नमो हनुमंता (x2)\nबने देवो मां कोण बलवंता? (x2)\n\nगणपतिजी के'छे माने रिद्धि सिद्धि नारी,\nहनुमानजी के'छे माने हुं तो बाल ब्रह्मचारी।\n\nनमो गणेशदेव नमो हनुमंता (x2)\nबने देवो मां कोण बलवंता? (x2)\n\nबने देवो मां कोण बलवंता?\nअय बन्ने देवो मां बेव बलवंता! (x2)"}, {"title": "१५. गणपतीनो थाळ (भोग गीत)", "body": "मारे मंदिरिये आजे कीधा छे । भोजनीया मन भावता,\nवेला वेला आवजो गणपती बाप्पा, वार न लागे आवता (x2)\n\nस्वागतमां पुष्पोनी माळा तैयार छे। (२)\nकोमल कळी ओथी मां गूंथेलो हार छे\nआनंद आनंद थाशे हैयामां प्रेम थकी पहेरावता,\nवेला वेला आवजो गणपती बाप्पा, वार न लागे आवता\n\nमारे मंदिरिये आजे कीधा छे भोजनीया मन भावता,\nवेला वेला आवजो गणपती बाप्पा, वार न लागे आवता\n\nरूपाना बाजठ पर कंचननो थाळ छे (x2)\nस्नेह भरी सामग्री सघळी तैयार छे। (x2)\nएक पछी एक हुं पीरसवा मांडु, आवे आनंद जमाडता\nवेला वेला आवजो गणपती बाप्पा, वार न लागे आवता\n\nमारे मंदिरिये आजे कीधा छे भोजनीया मन भावता,\nवेला वेला आवजो गणपती बाप्पा, वार न लागे आवता\n\nबुंदीना लाडु ने मावानी घारी\nपिस्तानी बरडीने सेव सुवाणी,\nप्रेमे आरोगजो लचपचता लाडु,\nथाक लाग्या छे मने वाळता,\nवेला वेला आवजो गणपती बाप्पा, वार न लागे आवता\n\nमारे मंदिरिये आजे कीधा छे भोजनीया मन भावता,\nवेला वेला आवजो गणपती बाप्पा, वार न लागे आवता\n\nदूधीनो हलवो ने पुरणपोळी (x2)\nबेपडी रोटली ने धीमां डबोळी,\nमगज, मेसुरने, मोहनथाळ ने वार लागी छे ठारता,\nवेला वेला आवजो गणपती बाप्पा, वार न लागे आवता\n\nशाक कीधा छे में विविध जातना\nशाक कीधा छे में विविध जातना (२)\nकरवा वखाण शुं केसरिया भातना, (x2)\n\nकढी अने दाळ करी वात निराळी ना थाय काने छे वधारता,\nवेला वेला आवजो गणपती बाप्पा, वार न लागे आवता\n\nजण मारा घरनुं ते जमनानुं जाणशो (x2)\n\nमुखवास करीने बाप्पा वात मारी मानजो। (x2)\nराम भक्त देव प्रभु नीतनीत आवजो।\nवार न लागे आवता\nवेला वेला आवजो गणपती बाप्पा, वार न लागे आवता (x2)"}, {"title": "१६. प्रार्थना", "body": "घालीन लोटांगण वंदीन चरण । डोळ्यांनी पाहिन रूप तुझें ।\nप्रेमें आलिंगन आनंदें पूजन । भावें ओवाळीन म्हणे नामा ॥\nत्वमेव माता च पिता त्वमेव । त्वमेव बंधुश्च सखा त्वमेव ।\nत्वमेव विद्या द्रविणं त्वमेव । त्वमेव सर्वं मम देवदेव ॥\nकायेन वाचा मनसेंद्रियैर्वा । बुद्ध्यात्मना वा प्रकृतिस्वभावात् ।\nकरोमि यद्यत्सकलं परस्मै । नारायणायेति समर्पयामि ॥\nअच्युतं केशवं रामनारायणं । कृष्णदामोदरं वासुदेवं हरिम् ।\nश्रीधरं माधवं गोपिकावल्लभं । जानकीनायकं रामचंद्रं भजे ॥\nहरे राम हरे राम राम राम हरे हरे ।\nहरे कृष्ण हरे कृष्ण कृष्ण कृष्ण हरे हरे ॥\nकर्पूरगौरं करुणावतारं । संसारसारं भुजगेन्द्रहारम् ।\nसदा वसन्तं हृदयारविन्दे । भवं भवानीसहितं नमामि ॥\nमंगल भगवान विष्णु, मंगलं गरुडध्वजः ।\nमंगल पुण्डरीकाक्ष, श्री मंगलाय तनो हरिः ॥\nसर्वमंगल मांगल्ये, शिवे सर्वार्थ साधिके ।\nशरण्ये त्र्यंबके गौरी, नारायणी नमोऽस्तुते ॥\nत्वमेव माता च पिता त्वमेव । त्वमेव बंधुश्च सखा त्वमेव ।\nत्वमेव विद्या द्रविणं त्वमेव । त्वमेव सर्वं मम देवदेव ॥\nगुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो महेश्वरः ।\nगुरुः साक्षात् परब्रह्म तस्मै श्रीगुरवे नमः ॥"}, {"title": "१७. श्री गणेश वंदना एवं प्रार्थना", "body": "विघ्नेश्वराय वरदाय सुरप्रियाय । लम्बोदराय सकलाय जगद्धिताय ॥ नागाननाय श्रुतियज्ञविभूषिताय । गौरीसुताय गणनाथ नमो नमस्ते ॥ वक्रतुंड महाकाय सूर्यकोटिसमप्रभ । निर्विघ्नं कुरु मे देव सर्वकार्येषु सर्वदा ॥ आवाहनं न जानामि न जानामि तवार्चनम् । पूजां चैव न जानामि क्षमस्व परमेश्वर ॥ अन्यथा शरणं नास्ति त्वमेव शरणं मम । तस्मात्कारुण्यभावेन रक्ष रक्ष महेश्वर ॥ गतं पापं गतं दुःखं गतं दारिद्र्यमेव च । आगता सुखसंपत्तिः पुण्योऽहं तव दर्शनात् ॥ मंत्रहीनं क्रियाहीनं भक्तिहीनं सुरेश्वर । यत्पूजितं मया देव परिपूर्णं तदस्तु मे ॥ यदक्षरं पदभ्रष्टं मात्राहीनं च यद्भवेत् । तत्सर्वं क्षम्यतां देव प्रसीद परमेश्वर ॥"}, {"title": "१८. श्री गणपति अथर्वशीर्षम्", "body": "ॐ नमस्ते गणपतये । त्वमेव प्रत्यक्षं तत्त्वमसि । त्वमेव केवलं कर्तासि । त्वमेव केवलं धर्तासि । त्वमेव केवलं हर्तासि । त्वमेव सर्वं खल्विदं ब्रह्मासि । त्वं साक्षादात्मासि नित्यम् ॥ ऋतं वच्मि । सत्यं वच्मि ॥ अव त्वं माम् । अव वक्तारम् । अव श्रोतारम् । अव दातारम् । अव धातार ः । ॐ समाहिताय नमः । ॐ आश्रिताय नमः । ॐ श्रीकराय नमः । ॐ सौम्याय नमः । ॐ भक्तवांछितदायकाय नमः । ॐ शान्ताय नमः । ॐ कैवल्यसुखदाय नमः । ॐ सच्चिदानन्दविग्रहाय नमः । ॐ ज्ञानिने नमः । ॐ दयायुताय नमः । ॐ दान्ताय नमः । ॐ ब्रह्मद्वेषविवर्जिताय नमः । ॐ प्रमत्तदैत्यभयदाय नमः । ॐ श्रीकण्ठाय नमः । ॐ विबुधेश्वराय नमः । ॐ रामार्चिताय नमः । ॐ विधये नमः । ॐ नागराजयज्ञोपवीतवते नमः । ॐ स्थूलकण्ठाय नमः । ॐ स्वयंकर्त्रे नमः । ॐ सामघोषप्रियाय नमः । ॐ परस्मै नमः । ॐ स्थूलतुण्डाय नमः । ॐ अग्रण्ये नमः । ॐ धीराय नमः । ॐ वागीशाय नमः । ॐ सिद्धिदायकाय नमः । ॐ दूर्वाबिल्वप्रियाय नमः । ॐ अव्यक्तमूर्तये नमः । ॐ अद्भुतमूर्तिमते नमः । ॐ शैलेन्द्रतनुजोत्संगखेलनोत्सुकमानसाय नमः । ॐ स्वलावण्यसुधासारजितमन्मथविग्रहाय नमः । ॐ समस्तजगदाधाराय नमः । ॐ मायिने नमः । ॐ मूषिकवाहनाय नमः । ॐ हृष्टाय नमः । ॐ तुष्टाय नमः । ॐ प्रसन्नात्मने नमः । ॐ सर्वसिद्धिप्रदायकाय नमः ॥ (समाप्त)"}, {"title": "२०. संतानप्राप्ति एवं लक्ष्मीप्राप्ति स्तोत्रम्", "body": "संतानप्राप्ति स्तोत्रम्: नमोऽस्तु गणनाथाय सिद्धिबुद्धियुताय च । सर्वप्रदाय देवाय पुत्रवृद्धिप्रदाय च ॥ १ ॥ गुरुराय गुरवे गोत्रे गुह्यासिताय ते । गोप्याय गोपिताशेषभुवनाय चिदात्मने ॥ २ ॥ विश्वमूलाय भव्याय विश्वसृष्टिकराय ते । नमो नमस्ते सत्याय सत्यपूर्णाय शुण्डिने ॥ ३ ॥ एकदन्ताय शुद्धाय सुमुखाय नमो नमः । प्रपन्नजनपालाय प्रणतार्तिविनाशिने ॥ ४ ॥ शरणं भव देवेश संततिं सुदृढां कुरु । भविष्यन्ति च ये पुत्रा मत्कुले गणनायक ॥ ५ ॥ ते सर्वे तथा पूजार्थं निरताः स्युर्वरो मतः । पुत्रप्रदमिदं स्तोत्रं सर्वसिद्धिप्रदायकम् ॥ ६ ॥\n\nलक्ष्मीप्राप्ति स्तोत्रम्: ॐ नमो विघ्नराजाय सर्वसौख्य प्रदायिने । दुष्टारिष्टविनाशाय पराय परमात्मने ॥ १ ॥ लम्बोदरं महावीर्यं नागयज्ञोपशोभितम् । अर्धचन्द्रधरं देवं विघ्नव्यूह विनाशनम् ॥ २ ॥ ॐ ह्रां ह्रीं ह्रूं ह्रैं ह्रौं ह्रः हेरम्बाय नमो नमः । सर्वसिद्धिप्रदोऽसि त्वं सिद्धिबुद्धिप्रदो भव ॥ ३ ॥"}]}, "en": {"docTitle": "Shri Ganesh Aarti Sangrah", "sections": [{"title": "1. Mangalacharan Shlok (Opening Verse)", "body": "Vakratunda Mahakaya Suryakoti Samaprabha |\nNirvighnam Kuru Me Deva Sarva-Karyeshu Sarvada ||"}, {"title": "2. Shri Ganesh Stotram (Sankat Nashan Stotram)", "body": "*(Reciting this removes all obstacles)*\n\n**(Narada Uvacha)**\n\nPranamya Shirasa Devam Gauri-Putram Vinayakam |\nBhakta-Avasam Smare-Nityam-Aayuh Kama-Artha Siddhaye ||\n\nPrathamam Vakratundam Cha Ekadantam Dviteeyakam |\nTriteeyam Krishna-Pingaksham Gajavaktram Chaturthakam ||\n\nLambodaram Panchamam Cha Shashtham Vikatameva Cha |\nSaptamam Vighnarajam Cha Dhumravarnam Tathashtakam ||\n\nNavamam Bhalachandram Cha Dashamam Tu Vinayakam |\nEkadasham Ganapatim Dvadasham Tu Gajananam ||\n\nDvadashaitani Namani Tri-Sandhyam Yah Pathen-Narah |\nNa Cha Vighna-Bhayam Tasya Sarva-Siddhi-Karam Param ||\n\nVidyarthi Labhate Vidyam Dhanarthi Labhate Dhanam |\nPutrarthi Labhate Putran Moksharthi Labhate Gatim ||\n\nJapet Ganapati Stotram Shadbhir-Masai Phalam Labhet |\nSamvatsarena Siddhim Cha Labhate Natra Samshayaha ||\n\nAshtabhyo Brahmanebhyash-Cha Likhitva Yah Samarpayet |\nTasya Vidya Bhavet Sarva Ganeshasya Prasadatah ||\n\n*Iti Shri Narada Purane Sankata-Nashanam Ganapati-Stotram Sampurnam*"}, {"title": "3. Jai Ganesh Deva (Aarti)", "body": "Jai Ganesh, Jai Ganesh, Jai Ganesh Deva |\nMata Jaki Parvati, Pita Mahadeva || (x2)\n\nEk Dant Dayavant, Chaar Bhuja-Dhari | (x2)\n\nMathe Par Tilak Sohe, Muse Ki Sawari || (x2)\n\nJai Ganesh, Jai Ganesh, Jai Ganesh Deva ||\nMata Jaki Parvati, Pita Mahadeva ||\n\nPaan Chadhe, Phool Chadhe, Aur Chadhe Mewa | (x2)\n\nLadduan Ka Bhog Lage, Sant Kare Sewa || (x2)\n\nJai Ganesh, Jai Ganesh, Jai Ganesh Deva ||\nMata Jaki Parvati, Pita Mahadeva ||\n\nAndhon Ko Aankh Det, Kodhin Ko Kaya | (x2)\n\nBaanjhan Ko Putra Det, Nirdhan Ko Maya || (x2)\n\nJai Ganesh, Jai Ganesh, Jai Ganesh Deva ||\nMata Jaki Parvati, Pita Mahadeva ||\n\nSoor-Shyam Sharan Aaye, Saphal Kije Sewa | (x2)\nMata Jaki Parvati, Pita Mahadeva ||\n\nJai Ganesh, Jai Ganesh, Jai Ganesh Deva ||\nMata Jaki Parvati, Pita Mahadeva ||"}, {"title": "4. Sukh Karta Dukh Harta (Aarti)", "body": "Sukh Karta Dukh Harta Varta Vighnachi |\nNurvi Purvi Prem Kripa Jayachi ||\nSarvangi Sundar Uti Sheendurachi |\nKanthi Jhalke Maal Muktaphalanchi ||\n\nJai Dev Jai Dev |\nJai Mangal Murti |\nOh Shree Mangalmurti |\nDarshan-Matre Man Kamna Purti ||\nJai Dev Jai Dev ||\n\nRatna-Khachit Phara Tuj Gauri-Kumara |\nChandanachi Uti Kumkum-Keshara ||\nHire-Jadit Mukuta Shobhato Bara |\nRunjhunti Nupure Charani Ghagariya ||\n\nJai Dev Jai Dev |\nJai Mangal Murti |\nOh Shree Mangalmurti |\nDarshan-Matre Man Kamna Purti ||\nJai Dev Jai Dev ||\n\nLambodar Peetambar Phanivar-Bandhana |\nSaral Sond Vakratunda Trinayana ||\nDas Ramacha Vat Pahe Sadana |\nSankati Pavave Nirvani Rakshave Suravar-Vandana ||\n\nJai Dev Jai Dev |\nJai Mangal Murti |\nOh Shree Mangalmurti |\nDarshan-Matre Man Kamna Purti ||\nJai Dev Jai Dev ||"}, {"title": "5. Sheendur Lal Chadhayo (Aarti)", "body": "Sheendur Lal Chadhayo, Achchha Gajmukhko |\nDondil Lal Biraje, Sut Gauri Harko ||\nHath Liye Gud-Laddoo, Sain Survarko |\nMahima Kahe Na Jay, Lagat Hu Padko ||\n\nJai Jai Shri Ganraj Vidya Sukhdata, Swami Sukhdata |\nDhanya Tumharo Darshan Mera Man Ramta, Jai Dev ||\n\nAshto Siddhi Dasi, Sankatko Vairi |\nVighna Vinashan Mangal Murat Adhikari ||\nKoti Suraj Prakash Aisi Chhabi Teri |\nGand-Sthal Mad-Mastak Jhule Shashi Bihari ||\n\nJai Jai Shri Ganraj Vidya Sukhdata, Swami Sukhdata |\nDhanya Tumharo Darshan Mera Man Ramta, Jai Dev ||\n\nBhav Bhagat-Se Koi Sharanagat Aave |\nSantat Sampat Sab Hi Bharpur Pave ||\nAise Tum Maharaj Moko Atibhave |\nGosavi Nandan Nishdin Gun-Gave ||\n\nJai Jai Shri Ganraj Vidya Sukhdata, Swami Sukhdata |\nDhanya Tumharo Darshan Mera Man Ramta, Jai Dev ||"}, {"title": "6. Nana Parimala Durva (Aarti)", "body": "Nana Parimala Durva Sheendur Shami-Patre |\nLaddoo Modak Ane Paripoorita Patre ||\nAise Pujan Kelya Beejakshara-Mantre |\nAshtahi Siddhi Navanidhi Desi Kshanamatre ||\n\nJai Dev Jai Dev |\nJai Mangalmurti, Shri Mangalmurti |\nTujhe Gun Varnaya Maj Kainchi Sphurti |\nJai Dev Jai Dev ||\n\nTujhe Dhyan Nirantar Je Koni Kariti |\nTyanchi Sakalahi Pape Vighnehi Hariti ||\nVaji Varana Shibika Sevak Suta Yuvati |\nSarvahi Pavuni Anti Bhavsagar Tarati ||\n\nJai Dev Jai Dev |\nJai Mangalmurti, Shri Mangalmurti |\nTujhe Gun Varnaya Maj Kainchi Sphurti |\nJai Dev Jai Dev ||\n\nSharanagata Sarvasve Bhajati Tav-Charani |\nKeerti Tayanchi Rahe Jonvar Shashi-Tarani ||\nTrailokyi Te Vijayi Adbhuta Ye Karani |\nGosavinandan Rata Nama-Smarani ||\n\nJai Dev Jai Dev |\nJai Mangalmurti, Shri Mangalmurti |\nTujhe Gun Varnaya Maj Kainchi Sphurti |\nJai Dev Jai Dev ||"}, {"title": "7. Yei Ho Vitthale Majhe Mauli (Vitthal Aarti)", "body": "Yei Ho Vitthale Majhe Mauli Ye | (x2)\n\nNidhalavari Kar\nNidhalavari Kar Thevuni Vat Mi Pahe ||\nho Thevuni Vat Mi Pahe\n\nYei Ho Vitthale Majhe Mauli Ye | (x2)\n\nAaliya Geliya Hati Dhadi Nirop | (x2)\n\nPandharpuri Aahe\nPandharpuri Aahe Maza Mayabap ||\nho Maza Mayabap\n\nYei Ho Vitthale Majhe Mauli Ye\nYei Ho Vitthale Majhe Mauli Ye || 1 ||\n\nPivala Peetambar Kaisa Gagani Jhalakala | (x2)\n\nGarudavari Baisoni\nGarudavari Baisoni Maza Kaivari Aala ||\nHo Maza Kaivari Aala\n\nYei Ho Vitthale Majhe Mauli Ye (x2)\n\nVithobache Rajya Amha Nitya Deepavali | (x2)\n\nVishnudas Nama\nVishnudas Nama Jivem-Bhaven Ovali ||\nho Jivem-Bhaven Ovali\n\nYei Ho Vitthale Majhe Mauli Ye (x2)\n\nAso Naso Bhaav Aamha Tujhiya Thaayi |\nKrupadrishti Pahe Majhya Pandhari Raaya ||\n\nYei Ho Vitthale Majhe Mauli Ye\nYei Ho Vitthale Majhe Mauli Ye || 4 ||"}, {"title": "8. Aarti Shankaracha (Shiv Aarti)", "body": "Lavathavati Vikrala Brahmandi Mala |\nVishe Kantha Kala Trinetri Jvala ||\nLavanya-Sundar Mastaki Bala |\nTethuniya Jal Nirmal Vahe Jhuljhula || 1 ||\n\nJai Dev Jai Dev |\nJai Shri Shankara |\nho swami shankara |\nAarti Ovalu Aarti Ovalu |\nTuj Karpur-Gaura |\nJai Dev Jai Dev\n\nKarpur-Gaur Bhola Nayani Vishala |\nArdhangi Parvati Sumananchya Mala ||\nVibhutiche Udhalan Shiti-Kantha Neela |\nAisa Shankar Shobhe Uma-Velhala || 2 ||\n\nJai Dev Jai Dev |\nJai Shri Shankara |\nho swami shankara |\nAarti Ovalu Aarti Ovalu |\nTuj Karpur-Gaura |\nJai Dev Jai Dev\n\nDevim Daityim Sagar Manthan Paim Kele |\nTyamaji Avachit Halahal Je Uthile ||\nTe Twam Asurapane Prashan Kele |\nNeelakantha Naam Prasiddha Jhale || 3 ||\n\nJai Dev Jai Dev |\nJai Shri Shankara |\nho swami shankara |\nAarti Ovalu Aarti Ovalu |\nTuj Karpur-Gaura |\nJai Dev Jai Dev\n\nVyaghrambar Phanivardhar Sundar Madanari |\nPanchanan Manmohan Munijana-Sukhakari ||\nShatakotinche Beej Vache Uchchari |\nRaghukul-Tilak Ramadasa-Antari || 4 ||\n\nJai Dev Jai Dev |\nJai Shri Shankara |\nho swami shankara |\nAarti Ovalu Aarti Ovalu |\nTuj Karpur-Gaura |\nJai Dev Jai Dev"}, {"title": "9. Aarti Shri Dnyandevachi", "body": "Aarti Dnyanraja |\nMahakaivalya-Teja | kaivalya-Teja\nSeviti Sadhu-Sant,\nManu Vedhla Majha | Vedhla Majha\nAarti Dnyanraja |\n\nLopale Dnyan Jagi |\nHit Nenati Koni | Nenati Koni\nAvataar Panduranga |\nNaam Thevile Dnyani | Thevile Dnyani\nAarti Dnyanraja |\n\nKanakache Taat Kari |\nUbhya Gopika Naari | Gopika Naari\nNarad Tumbar Ho |\nSaam Gaayan Kari | Gaayan Kari\nAarti Dnyanraja |\n\nPragat Guhya Bole |\nVishwa Brahmachi Kele | Brahmachi Kele\nRam Janardani Payi Mastak Thevile || Mastak Thevile\n\nAarti Dnyanraja | (x3)"}, {"title": "10. Mantra Pushpanjali & Shanti Mantra", "body": "**[Distribute / offer flowers to everyone now]**\n\nHari Om Yajnena Yajnamayajanta Devas-Tani Dharmani Prathamanyasan |\nTe Ha Nakam Mahimanah Sachante Yatra Purve Sadhyah Santi Devah ||\n\nOm Rajadhirajaya Prasahya Sahine | Om Namo Vayam Vaishravanaya Kurmahe |\nSa Me Kaman Kama Kamaya Mahyam Kameshvaro Vaishravano Dadatu |\nKuberaya Vaishravanaya Maharajaya Namah ||\n\nOm Swasti Samrajyam Bhaujam Swarajyam Vairajyam Parameshtyam Rajyam\nMaharajyam Adhipatyamayam Samanta Paryayi Syat Sarvabhaumah Sarvayusha\nAantad Parardhat | Prithivyai Samudraparyantaya Ekaraliti ||\n\nTadapyesha Shloko Bhegeeto Marutah Paraveshtaro Marutasyavasan Grihe |\nAvikshitasya Kama Prervishvedevah Sabha Sad Iti ||\n\nEkadantaya Vidmahe Vakratundaya Dheemahi | Tanno Danti Prachodayat ||\n\nOm Shantih Shantih Shantih ||"}, {"title": "11. Jaykara — Counting Chant", "body": "Ek Do Teen Chaar, Ganpati Ki Jai Jaikar | (x2)\n\nGanpati Ki Jai Jaikar | Ek Do Teen Chaar (x2)\n\nPanch Che Saat Aath, Ganpati Hamare Saath | (x2)\n\nGanpati Hamare Saath | Panch Che Saat Aath (x2)\n\nNaun Dus Gyarah Barah, Ganpati Hai Sabse Pyara | (x2)\n\nGanpati Hai Sabse Pyara | Naun Dus Gyarah Barah (x2)\n\nTera Chaudah Pandrah Solah, Ganpati Hai Sabse Bhola | (x2)\n\nGanpati Hai Sabse Bhola | Tera Chaudah Pandrah Solah (x2)\n\nSatra Atharah Unees Bees, Ganpati Hamare Beech || (x2)\n\nGanpati Hamare Beech, Satra Atharah Unees Bees (x2)\n\nBolo Ganapati Bappa / Morya\nMangal Murti / Morya\n\nMorya Re Bappa Morya Re |\nMorya Re Bappa Morya Re || (x5)\n\nUttar Se Bolo, Ganpati Bappa\nDakshin Se Bolo, Ganpati Bappa\nPurav Se Bolo, Ganpati Bappa\nPashchim Se Bolo, Ganpati Bappa\nUpar Se Bolo, Ganpati Bappa\nNiche Se Bolo, Ganpati Bappa\nDhire Se Bolo, Ganpati Bappa\nPrem Se Bolo, Ganpati Bappa\nZor Se Bolo, Ganpati Bappa\n\nAadha Laddu Chorya\nAme Tamara Porya\nMorya Re Bappa Morya Re"}, {"title": "12. Ashtavinayak Morya Chant", "body": "Moraya Moraya Ganapati Bappah Morya | (x2)\n\nMoraya Moraya Astavinayak Moraya || (x2)\n\nMoraya Moraya Ballaleshwar Moraya | (x2)\n\nMoraya Moraya Astavinayak Moraya || (x2)\n\nMoraya Moraya Varada Vinayak Moraya | (x2)\n\nMoraya Moraya Astavinayak Moraya || (x2)\n\nMoraya Moraya Mahaganapati Moraya | (x2)\n\nMoraya Moraya Astavinayak Moraya || (x2)\n\nMoraya Moraya Siddhivinayak Moraya | (x2)\n\nMoraya Moraya Astavinayak Moraya || (x2)\n\nMoraya Moraya Mayureshwar Moraya | (x2)\n\nMoraya Moraya Astavinayak Moraya || (x2)\n\nMoraya Moraya Girijatmaja Moraya | (x2)\n\nMoraya Moraya Astavinayak Moraya || (x2)\n\nMoraya Moraya Vigneshwar Moraya | (x2)\n\nMoraya Moraya Astavinayak Moraya || (x2)\n\nMoraya Moraya Chintamani Moraya | (x2)\n\nMoraya Moraya Astavinayak Moraya || (x2)\n\nMoraya Moraya Ganapati Bappah Moraya || (x2)\n\nMorya Re Bappa Morya Re |\nMorya Re Bappa Morya Re || (x5)"}, {"title": "13. Family Welcome Chants", "body": "Deva Gali Gali Mein Shor Machak Hai,\nGali Gali Mein Shor Machak Hai |\nGanpati Bappa Morya\n\nAala Aala Re Gajanand Aala |\n(Andheri) Mein Anand Zyala |\n(Desai Parivar) Mein Anand Zyala |\n\nGanpati Bappa Morya, Mangal Murti Morya |\nKaun Bolega Morya, Hum Bolega Morya | (x2)\n\nGanpati Gajanand Maharaj Ki Jai |\n\nWelcome Welcome Gajanana | (x2)\nI Love Vitthal Ramayana |\nGive Me Darshan Gajanana |\n\nAye Haal Bappa Bappa Haal,\nMaare Ghare Taru Kaam Che | (x2)\nTamne Jamadvaani Haav Che Re Bappa | (x2)\nGajanand Taaru Naam Che Re Bappa |\nNamo Navratna Che Re Bappa |\nHaal Haal Haal |\nAye Haal Bappa Bappa Haal, Maare Ghare Taru Kaam Che | (x2)"}, {"title": "14. Namo Ganeshdev Namo Hanumanta (Chant)", "body": "Namo Ganeshdev Namo Hanumanta, (x2)\nBane Devo Ma Kon Balwanta? (x2)\n\nGanpati Ji Ke'che Mane Modak Pesado,\nHanuman Ji Ke'che Mane Tel Chadhavao.\n\nNamo Ganeshdev Namo Hanumanta (x2)\nBane Devo Ma Kon Balwanta? (x2)\n\nGanpati Ji Ke'che Mane Phoolra Ni Mala,\nHanuman Ji Ke'che Mane Akra Ni Mala.\n\nNamo Ganeshdev Namo Hanumanta (x2)\nBane Devo Ma Kon Balwanta? (x2)\n\nGanpati Ji Ke'che Mane Ghee-Na Rota,\nHanuman Ji Ke'che Mane Sindoor Na Lota.\n\nNamo Ganeshdev Namo Hanumanta (x2)\nBane Devo Ma Kon Balwanta? (x2)\n\nGanpati Ji Ke'che Mane Choorma Ladoo,\nHanuman Ji Ke'che Mane Tel Chadhe Ladoo.\n\nNamo Ganeshdev Namo Hanumanta (x2)\nBane Devo Ma Kon Balwanta? (x2)\n\nGanpati Ji Ke'che Mane Mata Ane Pita,\nHanuman Ji Ke'che Mane Ram Ane Sita.\n\nNamo Ganeshdev Namo Hanumanta (x2)\nBane Devo Ma Kon Balwanta? (x2)\n\nGanpati Ji Ke'che Mane Riddhi Siddhi Naari,\nHanuman Ji Ke'che Mane Hu Toh Baal Brahmachaari.\n\nNamo Ganeshdev Namo Hanumanta (x2)\nBane Devo Ma Kon Balwanta? (x2)\n\nBane Devo Ma Kon Balwanta?\nAy Banne Devo Ma Bev Balwanta! (x2)"}, {"title": "15. Ganpati no Thaal (Offering Song)", "body": "Mare Mandiriye Aaje Kidha Chhe | Bhojaniya Man Bhavta,\nvela vela aavjo ganpati bappa, vaar na laage aavta (x2)\n\nSwagatma Pushponi Mala Taiyar Chhe. (2)\nKomal Kali Othi Maa Guntelo Haar Chhe\nAnand Anand Thashe Haiyama, Prem Thaki Peheravta,\nvela vela aavjo ganpati bappa, vaar na laage aavta\n\nMare Mandiriye Aaje Kidha Chhe Bhojaniya Man Bhavta,\nvela vela aavjo ganpati bappa, vaar na laage aavta\n\nRupana Bajath Par Kanchanno Thaal Chhe (x2)\nSneh Bhari Samagri Saghli Taiyar Chhe. (x2)\nEk Pachhi Ek Hu Pirasva Mandu, Aave Anand Jamadta\nvela vela aavjo ganpati bappa, vaar na laage aavta\n\nMare Mandiriye Aaje Kidha Chhe Bhojaniya Man Bhavta,\nvela vela aavjo ganpati bappa, vaar na laage aavta\n\nBundina Ladu Ne Mavani Ghari\nPistani Bardine Sev Suvani,\nPreme Arogjo Lachpachta Ladu,\nThaak Lagya Chhe Mane Valta,\nvela vela aavjo ganpati bappa, vaar na laage aavta\n\nMare Mandiriye Aaje Kidha Chhe Bhojaniya Man Bhavta,\nvela vela aavjo ganpati bappa, vaar na laage aavta\n\nDudhino Halvo Ne Puranpoli (x2)\nBepadi Rotli Ne Ghima Daboli,\nMagaj, Mesurne, Mohanthal Ne Vaar Lagi Chhe Thaarta,\nvela vela aavjo ganpati bappa, vaar na laage aavta\n\nShaak Kidha Chhe Me Vividh Jatna\nShaak Kidha Chhe Me Vividh Jatna (2)\nKarva Vakhaan Shu Kesariya Bhatna, (x2)\n\nKadhi Ane Daal Kari Vaat Nirali Na Thay Kaane Chhe Vadharta,\nvela vela aavjo ganpati bappa, vaar na laage aavta\n\nJan Mara Gharnu Te Jamnanu Jaanso (x2)\n\nMukhvaas Karine Bappa Vaat Mari Maanjo. (x2)\nRam Bhakt Dev Prabhu Nitnit Aavjo.\nvaar na laage aavta\nvela vela aavjo ganpati bappa, vaar na laage aavta (x2)"}, {"title": "16. Prathna", "body": "Ghalin Lotangan Vandin Charan | Dolyani Pahin Roop Tujhe |\nPreme Aalingan Aanande Pujan | Bhave Ovalin Mhane Nama ||\n\nTvamev Mata Cha Pita Tvamev | Tvamev Bandhush-Cha Sakha Tvamev |\nTvamev Vidya Dravinam Tvamev | Tvamev Sarvam Mama Deva Deva ||\n\nKayena Vacha Manasendriyairva | Buddhyatmana Va Prakriteh Swabhavat |\nKaromi Yad Yat Sakalam Parasmai | Narayanayeti Samarpayami ||\n\nAchyutam Keshavam Rama-Narayanam | Krishna Damodaram Vasudevam Harim |\nSreedharam Madhavam Gopika-Vallabham | Janaki-Nayakam Ramachandram Bhaje ||\n\nHare Rama Hare Rama, Rama Rama Hare Hare |\nHare Krishna Hare Krishna, Krishna Krishna Hare Hare ||\n\nKarpur Gauram Karunavataram | Samsara Saram Bhujagendra Haram |\nSada Vasantam Hridayaravinde | Bhavam Bhavani Sahitam Namami ||\n\nMangalam Bhagavan Vishnum, Mangalam Garudadhvajah |\nMangalam Pundarikaksham, Mangalay Tano Harih ||\nSarva Mangala Mangalye, Shive Sarvartha Sadhike |\nSharanye Tryambake Gauri, Narayani Namostute ||\n\nTvamev Mata Cha Pita Tvamev | Tvamev Bandhush-Cha Sakha Tvamev |\nTvamev Vidya Dravinam Tvamev | Tvamev Sarvam Mama Deva Deva ||\n\nGurur Brahma Gurur Vishnuh Gururdevo Maheshvarah |\nGurur Sakshat Parabrahma Tasmai Shri Gurave Namah ||"}, {"title": "17. Shri Ganesh Vandana & Prarthana", "body": "Vighneshvaraya Varadaya Surapriyaya |\nLambodaraya Sakalaya Jagaddhitaya ||\nNagananaya Shruti-Yajna-Vibhushitaya |\nGaurisutaya Gananatha Namo Namaste ||\n\nVakratunda Mahakaya Suryakoti Samaprabha |\nNirvighnam Kuru Me Deva Sarva-Karyeshu Sarvada ||\n\nAvahanam Na Janami Na Janami Tavarchanam |\nPujam Chaiva Na Janami Kshamasva Parameshvara ||\n\nAnyatha Sharanam Nasti Tvamev Sharanam Mama |\nTasmat Karunya-Bhaven Raksha Raksha Maheshvara ||\n\nGatam Papam Gatam Dukham Gatam Daridrayameva Cha |\nAagata Sukhasampattih Punyoham Tava Darshanat ||\n\nMantraheenam Kriyaheenam Bhaktiheenam Sureshvara |\nYatpujitam Maya Deva Paripurnam Tadastume ||\n\nYadaksharam Padabrashtam Matraheenam Cha Yad Bhavet |\nTatsarvam Kshamyatam Deva Prasida Parameshvara ||"}, {"title": "18. Shri Ganapati Atharvashirsham (with Dhyanam and Gayatri)", "body": "Om Namaste Ganapataye |\nTvameva Pratyaksham Tattvamasi |\nTvameva Kevalam Kartasi |\nTvameva Kevalam Dhartasi |\nTvameva Kevalam Hartasi |\nTvameva Sarvam Khalvidam Brahmasi |\nTvam Sakshadatmasi Nityam ||\n\nRtam Vachmi |\nSatyam Vachmi ||\n\nAva Tvam Mam |\nAva Vaktaram |\nAva Shrotaram |\nAva Dataram |\nAva Dhataram |\nAva Anuchanamava Shishyam |\nAva Pashchattat |\nAva Purastat |\nAvottarattat |\nAva Dakshinattat |\nAva Chodhvattat |\nAva Dharattat |\nSarvato Mam Pahi Pahi Samantat ||\n\nTvam Vangmayastvam Chinmayaha |\nTvamanandamayastvam Brahmamayaha |\nTvam Sachchidanandadviteeyosi |\nTvam Pratyaksham Brahmasi |\nTvam Jnanamayo Vijnanamayosi ||\n\nSarvam Jagadidam Tvatto Jayate |\nSarvam Jagadidam Tvattas-Tishthati |\nSarvam Jagadidam Tvayi Layameshyati |\nSarvam Jagadidam Tvayi Pratyeti ||\n\nTvam Bhumir-Aponalo-Nilo Nabhaha |\nTvam Chatvari Vakpadani |\nTvam Gunatrayateetaha |\nTvam Avasthatrayateetaha |\nTvam Dehatrayateetaha |\nTvam Kalatrayateetaha |\nTvam Muladhara-Sthitosi Nityam |\nTvam Shaktitrayatmakaha |\nTvam Yogino Dhyayanti Nityam |\nTvam Brahma Tvam Vishnustvam Rudrastvam Indrastvam Agnistvam Vayustvam Suryastvam Chandramastvam Brahma-Bhur-Bhuvas-Svarom ||\n\nGanadin Purvamuchcharya Varnadims-Tadanantaram |\nAnusvarah Paratarah |\nArdhendulasitam |\nTarena Ruddham |\nEtat-Tava Manu-Svarupam |\nGakarah Purvarupam |\nAkarah Madhyamarupam |\nAnusvarash-Chantyarupam |\nBindur-Uttararupam |\nNadah Sandhanam |\nSamhita Sandhihi |\nSaisha Ganesha-Vidya |\nGanaka Rishihi |\nNichrd-Gayatri-Chhandah |\nGanapati-Devata |\nOm Gam Ganapataye Namah ||\n\n**Ganesh Gayatri Mantra:**\nEkadantaya Vidmahe Vakratundaya Dheemahi |\nTanno Danti Prachodayat ||\n\n**Dhyanam:**\nEkadantam Chatur-Hastam Pasham-Ankusha-Dharinam |\nRadam Cha Varadam Hastair-Bibhranam Mushaka-Dhvajam ||\nRaktam Lambodaram Shurpa-Karnakam Rakta-Vasasam |\nRakta-Gandhanuleptangam Rakta-Pushpaih Supujitam ||\nBhaktanukampinam Devam Jagat-Karanam-Achyutam |\nAvirbhutam Cha Srishtyadau Prakriteh Purushat-Param ||\nEvam Dhyayati Yo Nityam Sa Yogi Yoginam Varah ||\n\n**Namaskara Mantra:**\nNamo Vratapataye Namo Ganapataye Namah Pramathapataye |\nNamaste Astu Lambodaraya Ekadantaya Vighna-Nashine Shiva-Sutaya Shree Varadamurtaye Namah ||\n\nEtadatharvashirsham Yodhite |\nSa Brahmabhuyaya Kalpate |\nSa Sarvavighnair-Na Badhyate |\nSa Sarvatah Sukhamedhate |\nSa Panchamahapapat-Pramuchyate |\nSayamadhiyano Divasakritam Papam Nashayati |\nPrataradhiyano Ratrikritam Papam Nashayati |\nSayam Pratah Prayunjanopapo Bhavati |\nSarvatradhiyanopavighno Bhavati |\nDharmartha-Kama-Moksham Cha Vindati |\nIdamatharvashirsham Ashishyaya Na Deyam |\nYo Yadi Mohad-Dasyati Sa Papiyan-Bhavati |\nSahasravartanadyam Yam Kamamadhite Tam Tamanena Sadhayet |\nAnena Ganapatim-Abhishinchati Sa Vagmi Bhavati |\nChaturthyamanashnan Japati Sa Vidyavan Bhavati |\nItyatharvanavakyam |\nBrahmadyavaranam Vidyanna Bibheti Kadachaneti |\nYo Durvankurair-Yajati Sa Vaishravanopamo Bhavati |\nYo Lajairyajati Sa Yashovan Bhavati |\nSa Medhavan Bhavati |\nYo Modakasahasrena Yajati Sa Vanchhitaphalam-Avapnoti |\nYah Sajyasamidbhir-Yajati Sa Sarvam Labhate Sa Sarvam Labhate |\nAshtau Brahmanan Samyaggrahayitva Suryavarchasvi Bhavati |\nSuryagrahe Mahanadyam Pratimasannidhau Va Japtva Siddhamantro Bhavati |\nMahavighnat-Pramuchyate |\nMahadoshat-Pramuchyate |\nMahapratyavayat-Pramuchyate |\nSa Sarvavid-Bhavati Sa Sarvavid-Bhavati |\nYa Evam Veda |\nItyupanishat ||\n\nOm Shantih Shantih Shantih ||\n\n*Iti Ganapaty-Atharvashirsham*"}, {"title": "19. 108 Names of Lord Ganesha (Ashtottara Shatanamavali)", "body": "Om Vinayakaya Namah\nOm Vighnarajaya Namah\nOm Gauriputraya Namah\nOm Ganeshvaraya Namah\nOm Skandagrajaya Namah\nOm Avyayaya Namah\nOm Putaya Namah\nOm Dakshaya Namah\nOm Adhyakshaya Namah\nOm Dvijapriyaya Namah\nOm Agnigarbhachchhide Namah\nOm Indrashripradaya Namah\nOm Vanipradaya Namah\nOm Avyayaya Namah\nOm Sarvasiddhipradaya Namah\nOm Sarvatanayaya Namah\nOm Sharvaripriyaya Namah\nOm Sarvatmakaya Namah\nOm Srishtikartre Namah\nOm Devaya Namah\nOm Anekarchitaya Namah\nOm Shivaya Namah\nOm Shuddhaya Namah\nOm Buddhipriyaya Namah\nOm Shantaya Namah\nOm Brahmacharine Namah\nOm Gajananaya Namah\nOm Dvaimaturaya Namah\nOm Munistutaya Namah\nOm Bhaktavighnavinashanaya Namah\nOm Ekadantaya Namah\nOm Chaturbahave Namah\nOm Chaturaya Namah\nOm Shaktisamyutaya Namah\nOm Lambodaraya Namah\nOm Shurpakarnaya Namah\nOm Haraye Namah\nOm Brahmaviduttamaya Namah\nOm Kalaya Namah\nOm Grahapataye Namah\nOm Kamine Namah\nOm Somasuryagnilochanaya Namah\nOm Pashankushadharaya Namah\nOm Chandaya Namah\nOm Gunatitaya Namah\nOm Niranjanaya Namah\nOm Akalmashaya Namah\nOm Svayamsiddhaya Namah\nOm Siddharchitapadambujaya Namah\nOm Bijapuraphalasaktaya Namah\nOm Varadaya Namah\nOm Shashvataya Namah\nOm Kritine Namah\nOm Dvijapriyaya Namah\nOm Vitabhayaya Namah\nOm Gadine Namah\nOm Chakrine Namah\nOm Ikshuchapadhrite Namah\nOm Shridaya Namah\nOm Ajaya Namah\nOm Utpalakaraya Namah\nOm Shripataye Namah\nOm Stutiharshitaya Namah\nOm Kuladribhrite Namah\nOm Jatilaya Namah\nOm Kalikalmashanashanaya Namah\nOm Chandrachudamanaye Namah\nOm Kantaya Namah\nOm Papaharine Namah\nOm Samahitaya Namah\nOm Ashritaya Namah\nOm Shrikaraya Namah\nOm Saumyaya Namah\nOm Bhaktavanchhitadayakaya Namah\nOm Shantaya Namah\nOm Kaivalyasukhadaya Namah\nOm Sacchidanandavigrahaya Namah\nOm Jnanine Namah\nOm Dayayutaya Namah\nOm Dantaya Namah\nOm Brahmadveshavivarjitaya Namah\nOm Pramattadaityabhayadaya Namah\nOm Shrikanthaya Namah\nOm Vibudheshvaraya Namah\nOm Ramarchitaya Namah\nOm Vidhaye Namah\nOm Nagarajayajnopavitavate Namah\nOm Sthulakanthaya Namah\nOm Svayamkartre Namah\nOm Samaghoshapriyaya Namah\nOm Parasmai Namah\nOm Sthulatundaya Namah\nOm Agranyaya Namah\nOm Dhiraya Namah\nOm Vagishaya Namah\nOm Siddhidayakaya Namah\nOm Durvabilvapriyaya Namah\nOm Avyaktamurtaye Namah\nOm Adbhutamurtimate Namah\nOm Shailendratanujotsanga-Khelanotsukamanasaya Namah\nOm Svalavanyasudhasarajita-Manmathavigrahaya Namah\nOm Samastajagadadharaya Namah\nOm Mayine Namah\nOm Mushikavahanaya Namah\nOm Hrishtaya Namah\nOm Tushtaya Namah\nOm Prasannatmane Namah\nOm Sarvasiddhipradayakaya Namah ||\n\n*(Samapta — Concluded)*"}, {"title": "20. Santan Prapti Stotram & Laxmi Prapti Stotram", "body": "**Santan Prapti Stotram:**\n\nNamostu Gananathaya Siddhi-Buddhi-Yutaya Cha |\nSarvapradaya Devaya Putra-Vriddhi-Pradaya Cha ||\nGururaya Guruve Goshtra Guhyasitaya Te |\nGopyaya Gopitashesha-Bhuvanaya Chidatmane ||\nVishwamulaya Bhavyaya Vishwasrishtikaraya Te |\nNamo Namaste Satyaya Satyapurnaya Shundine ||\nEkadantaya Shuddhaya Sumukhaya Namo Namah |\nPrapanna-Jana-Palaya Pranatarti-Vinashine ||\nSharanam Bhava Devesha Santatim Suddridham Kuru |\nBhavishyanti Cha Ye Putra Matkule Gananayaka ||\nTe Sarve Tatha Pujartham Niratah Syurvaro Matah |\nPutrapradamidam Stotram Sarvasiddhi Pradayakam ||\n\n**Laxmi Prapti Stotram:**\n\nOm Namo Vighnarajaya Sarvasaukhya Pradayine |\nDushtarishhta-Vinashaya Paraya Paramatmane ||\nLambodaram Mahaviryam Nagayajnopashobhitam |\nArdhachandradharam Devam Vighnavyvha Vinashanam ||\nOm Hram Hrim Hrum Hraim Hraum Hrah Herambaya Namo Namah |\nSarvasiddhiprado Asi Tvam Siddhi-Buddhi-Prado Bhava ||\n\n---"}]}};
let currentLang = 'en';
let currentIndex = 0;

function openLang(lang) {
  currentLang = lang;
  document.getElementById('welcome').style.display = 'none';
  showIndex();
}

function showIndex() {
  document.getElementById('section-screen').style.display = 'none';
  document.getElementById('index-screen').style.display = 'block';
  document.getElementById('index-title').textContent = AARTI_DATA[currentLang].docTitle || 'Shri Ganesh Aarti Sangrah';
  const list = document.getElementById('index-list');
  list.innerHTML = '';
  AARTI_DATA[currentLang].sections.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'index-item';
    btn.innerHTML = '<span class="index-num">' + (i + 1) + '.</span>' + s.title.replace(/^[0-9]+\.\s*/, '');
    btn.onclick = () => openSection(i);
    list.appendChild(btn);
  });
  window.scrollTo(0, 0);
}

function goWelcome() {
  document.getElementById('index-screen').style.display = 'none';
  document.getElementById('section-screen').style.display = 'none';
  document.getElementById('welcome').style.display = 'flex';
  window.scrollTo(0, 0);
}

function goIndex() {
  document.getElementById('section-screen').style.display = 'none';
  showIndex();
}

function openSection(idx) {
  currentIndex = idx;
  const sec = AARTI_DATA[currentLang].sections[idx];
  document.getElementById('index-screen').style.display = 'none';
  document.getElementById('section-screen').style.display = 'block';
  document.getElementById('section-title').textContent = sec.title;
  document.getElementById('section-body').textContent = sec.body;
  document.getElementById('section-position').textContent = (idx + 1) + ' / ' + AARTI_DATA[currentLang].sections.length;
  document.getElementById('prev-btn').disabled = idx === 0;
  document.getElementById('next-btn').disabled = idx === AARTI_DATA[currentLang].sections.length - 1;
  window.scrollTo(0, 0);
}

function prevSection() { if (currentIndex > 0) openSection(currentIndex - 1); }
function nextSection() {
  if (currentIndex < AARTI_DATA[currentLang].sections.length - 1) openSection(currentIndex + 1);
}
</script>
